  <!-- ===================================================================
       EDITABLE PAGE CONTENT
       This is where the words on the page live. Edit the text inside the
       JSX below, save, and reload. Each section is labelled.
       Images come from the SITE PHOTO MAP (window.BD_IMAGES) in the <head>.

  <!-- Sections 1/2: Nav · Hero · Awards · Highlights (Live & Loud) -->
  <script type="text/babel">
  /* Big Daddy and Co. — website sections (part 1): Nav, Hero, Awards, Highlights.
     Composes primitives from the design-system bundle namespace. */

  const { Wordmark, Button, Stamp, SectionHeading, AwardLaurel } = window.NashSMomDesignSystem_77335a;

  const NAV_LINKS = ['Shows', 'The Band', 'Records', 'Book Us'];

  function Nav({ onBook }) {
    const [solid, setSolid] = React.useState(false);
    React.useEffect(() => {
      const el = document.querySelector('[data-scroll]') || window;
      const target = document.querySelector('[data-scroll]');
      const onScroll = () => setSolid((target ? target.scrollTop : window.scrollY) > 40);
      el.addEventListener('scroll', onScroll);
      return () => el.removeEventListener('scroll', onScroll);
    }, []);
    return (
      <header style={{
        position: 'sticky', top: 0, zIndex: 50,
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '14px clamp(20px,5vw,64px)',
        background: solid ? 'rgba(7,9,15,0.86)' : 'transparent',
        backdropFilter: solid ? 'blur(10px) saturate(1.2)' : 'none',
        borderBottom: solid ? '1px solid var(--border-hairline)' : '1px solid transparent',
        transition: 'all var(--dur-med) var(--ease-out)',
      }}>
        <img src="assets/brand/big-daddy-wordmark.svg" alt="Big Daddy and Co." style={{ height: 34, width: 'auto', display: 'block' }} />
        <nav style={{ display: 'flex', alignItems: 'center', gap: 28 }}>
          <div style={{ display: 'flex', gap: 26 }} className="nm-navlinks">
            {NAV_LINKS.map((l) => (
              <a key={l} href={'#' + l.toLowerCase().replace(/\s/g, '')}
                 style={{ fontFamily: 'var(--font-heading)', fontWeight: 500, fontSize: 14,
                          textTransform: 'uppercase', letterSpacing: '.1em', color: 'var(--bone-300)' }}
                 onMouseEnter={(e) => e.target.style.color = 'var(--ember-glow)'}
                 onMouseLeave={(e) => e.target.style.color = 'var(--bone-300)'}>{l}</a>
            ))}
          </div>
          <Button variant="primary" size="sm" onClick={onBook}>Buy Tickets</Button>
        </nav>
      </header>
    );
  }

  function Hero({ onTickets, onBook }) {
    return (
      <section className="nm-grain" style={{
        position: 'relative', minHeight: '92vh', display: 'flex', flexDirection: 'column',
        justifyContent: 'flex-end', overflow: 'hidden', marginTop: '-72px', paddingTop: '72px',
      }}>
        <img src={window.BD_IMAGES.heroBackground} alt="Big Daddy and Co. live"
             style={{ position: 'absolute', inset: 0, width: '100%', height: '100%',
                      objectFit: 'cover', objectPosition: 'center 30%', filter: 'saturate(0.95) brightness(0.62)' }} />
        <div style={{ position: 'absolute', inset: 0, background: 'var(--scrim-full)' }} />
        <div style={{ position: 'absolute', inset: 0, background: 'var(--spot-ember)' }} />
        <div style={{ position: 'relative', zIndex: 3, padding: '0 clamp(20px,5vw,64px) clamp(48px,7vw,96px)', maxWidth: 1100 }}>
          <div style={{ display: 'flex', gap: 10, marginBottom: 22, flexWrap: 'wrap' }}>
            <Stamp tone="ember" rotate={-3}>World Tour 2026</Stamp>
            <Stamp tone="volt" rotate={2}>New Record Out Now</Stamp>
          </div>
          <div className="nm-hero-wm"><Wordmark size={128} layout="stacked" glow /></div>
          <p style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--fs-lead)', color: 'var(--bone-200)',
                      maxWidth: 600, marginTop: 24, lineHeight: 1.5 }}>
            A world-traveling jam band at the peak of its fame — equally at home in a sweaty basement or a sold-out arena.
            Four original guys and their guests, a shared dream, and a backwards cap. This is Big Daddy... and Company.
          </p>
          <div style={{ display: 'flex', gap: 14, marginTop: 30, flexWrap: 'wrap' }}>
            <Button variant="primary" size="lg" onClick={onTickets}>See Tour Dates</Button>
            <Button variant="outline" size="lg" onClick={onBook}>Book the Band</Button>
          </div>
        </div>
      </section>
    );
  }

  function AwardsStrip() {
    const awards = [
      { year: '2024', title: 'Grammy Nomination', detail: 'Best Jam Performance', tone: 'ember' },
      { year: '2025', title: 'Battle of the Beyblades', detail: 'Third Place Brawler', tone: 'bone' },
      { year: '2025', title: 'Festival Honor', detail: 'Headliner — The Shred Shed', tone: 'volt' },
      { year: '2026', title: 'Best Band', detail: 'Voted by the Co.', tone: 'bone' },
    ];
    return (
      <section style={{ borderTop: '1px solid var(--border-hairline)', borderBottom: '1px solid var(--border-hairline)',
                        background: 'var(--surface-raised)' }}>
        <div className="nm-container" style={{ padding: '28px clamp(20px,5vw,64px)' }}>
          <div style={{ fontFamily: 'var(--font-stamp)', fontSize: 11, letterSpacing: '.2em',
                        textTransform: 'uppercase', color: 'var(--bone-400)', textAlign: 'center', marginBottom: 18 }}>
            ★ Accolades &amp; Honors ★
          </div>
          <div style={{ display: 'flex', gap: 24, justifyContent: 'center', flexWrap: 'wrap' }}>
            {awards.map((a, i) => <AwardLaurel key={i} {...a} />)}
          </div>
        </div>
      </section>
    );
  }

  /* ===================================================================
     THE VIDEO — "Chasing Big Daddy"
     Two clips, both listed in the SITE VIDEO MAP at the top of the file:
       • VideoBanner — full-width 10s loop. Runs silent; click it (or press
         Enter on the Sound button) to turn the sound on. It mutes itself
         again once you scroll past it.
       • ClipTile    — the short square clip that sits in the "Live & Loud"
         grid. Silent loop; click it for the full-screen player.
     Both clips only download once they scroll into view, and neither
     auto-plays for visitors who ask for reduced motion.
     =================================================================== */

  const bdReducedMotion = () =>
    !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* Loads the file on first sight, plays while visible, pauses + drops the
     sound once it scrolls away. Returns the ref to hang on the <video>. */
  function useInViewLoop(src, onMuteAway) {
    const ref = React.useRef(null);
    React.useEffect(() => {
      const el = ref.current;
      if (!el) return;
      const reduced = bdReducedMotion();
      const io = new IntersectionObserver(([entry]) => {
        if (!entry) return;
        if (entry.isIntersecting) {
          if (!el.getAttribute('src')) el.setAttribute('src', src);
          if (!reduced) { const p = el.play(); if (p && p.catch) p.catch(() => {}); }
        } else {
          el.pause();
          if (!el.muted) { el.muted = true; if (onMuteAway) onMuteAway(); }
        }
      }, { threshold: 0.15 });
      io.observe(el);
      return () => io.disconnect();
    }, [src]);
    return ref;
  }

  /* Little speaker glyph for the banner's sound button. */
  function SoundIcon({ on }) {
    return (
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"
           style={{ display: 'block', flex: '0 0 auto' }}>
        <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none" />
        {on
          ? <React.Fragment><path d="M16.5 8.5a5 5 0 0 1 0 7" /><path d="M19 6a8.5 8.5 0 0 1 0 12" /></React.Fragment>
          : <React.Fragment><path d="M17 9.5l4.5 5" /><path d="M21.5 9.5l-4.5 5" /></React.Fragment>}
      </svg>
    );
  }

  function VideoBanner() {
    const [sound, setSound] = React.useState(false);
    const [hover, setHover] = React.useState(false);
    const ref = useInViewLoop(window.BD_VIDEOS.banner, () => setSound(false));

    const toggleSound = () => {
      const el = ref.current;
      if (!el) return;
      if (!el.getAttribute('src')) el.setAttribute('src', window.BD_VIDEOS.banner);
      const next = !sound;
      el.muted = !next;
      if (next) el.volume = 0.85;
      const p = el.play(); if (p && p.catch) p.catch(() => {});
      setSound(next);
    };

    return (
      <section id="video" className="nm-grain" onClick={toggleSound}
               onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
               aria-label={window.BD_VIDEOS.title + ' — official music video'}
               style={{
                 position: 'relative', overflow: 'hidden', cursor: 'pointer',
                 height: 'clamp(230px, 32vw, 420px)', background: 'var(--stage-black)',
                 borderTop: '1px solid var(--border-hairline)',
                 borderBottom: '1px solid var(--border-hairline)',
               }}>
        <video ref={ref} muted loop playsInline preload="none" tabIndex={-1}
               poster={window.BD_VIDEOS.bannerPoster} aria-hidden="true"
               style={{ position: 'absolute', inset: 0, width: '100%', height: '100%',
                        objectFit: 'cover', objectPosition: 'center 38%',
                        filter: 'saturate(0.98) brightness(0.76)' }} />
        {/* scrims: bottom for the type, side fades so the square crop melts into the page */}
        <div style={{ position: 'absolute', inset: 0, background: 'var(--scrim-bottom)' }} />
        <div style={{ position: 'absolute', inset: 0, background:
              'linear-gradient(90deg, rgba(11,14,22,0.9), rgba(11,14,22,0) 20%, rgba(11,14,22,0) 80%, rgba(11,14,22,0.9))' }} />
        <div style={{ position: 'absolute', inset: 0, background: 'var(--spot-ember)', opacity: 0.45 }} />

        <div style={{ position: 'absolute', left: 0, right: 0, bottom: 0, zIndex: 3,
                      display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between',
                      gap: 16, flexWrap: 'wrap',
                      padding: '0 clamp(20px,5vw,64px) clamp(16px,2.2vw,30px)' }}>
          <div>
            <div style={{ fontFamily: 'var(--font-stamp)', fontSize: 11, letterSpacing: '.2em',
                          textTransform: 'uppercase', color: 'var(--ember-glow)' }}>
              {window.BD_VIDEOS.kicker}
            </div>
            <div className="nm-display" style={{ fontSize: 'clamp(26px,4.4vw,58px)', marginTop: 6,
                                                 textShadow: 'var(--text-glow-ember)' }}>
              {window.BD_VIDEOS.title}
            </div>
          </div>
          <button type="button" onClick={(e) => { e.stopPropagation(); toggleSound(); }}
                  aria-pressed={sound}
                  aria-label={sound ? 'Mute the music video' : 'Play the music video with sound'}
                  style={{
                    display: 'inline-flex', alignItems: 'center', gap: 9, cursor: 'pointer',
                    padding: '9px 15px', borderRadius: 'var(--r-pill)',
                    fontFamily: 'var(--font-stamp)', fontSize: 11, letterSpacing: '.16em',
                    textTransform: 'uppercase', whiteSpace: 'nowrap',
                    background: 'rgba(7,9,15,0.6)',
                    WebkitBackdropFilter: 'blur(8px)', backdropFilter: 'blur(8px)',
                    border: '1px solid ' + (sound ? 'var(--ember-500)' : 'var(--border-strong)'),
                    color: sound ? 'var(--ember-glow)' : 'var(--bone-100)',
                    boxShadow: (sound || hover) ? 'var(--glow-ember-hot)' : 'none',
                    transition: 'all var(--dur-med) var(--ease-out)',
                  }}>
            <SoundIcon on={sound} />
            {sound ? 'Sound On' : 'Tap for Sound'}
          </button>
        </div>
      </section>
    );
  }

  /* Full-screen player for the short clip — sound on, real controls. */
  function VideoTheater({ src, title, onClose }) {
    React.useEffect(() => {
      const onKey = (e) => { if (e.key === 'Escape') onClose(); };
      document.addEventListener('keydown', onKey);
      const prev = document.documentElement.style.overflow;
      document.documentElement.style.overflow = 'hidden';
      return () => { document.removeEventListener('keydown', onKey); document.documentElement.style.overflow = prev; };
    }, [onClose]);
    return ReactDOM.createPortal(
      <div onClick={onClose} role="dialog" aria-modal="true" aria-label={title}
           style={{ position: 'fixed', inset: 0, zIndex: 10001, display: 'flex', alignItems: 'center',
                    justifyContent: 'center', padding: 'clamp(16px,5vw,56px)', background: 'rgba(7,9,15,0.93)',
                    WebkitBackdropFilter: 'blur(6px)', backdropFilter: 'blur(6px)' }}>
        <button onClick={onClose} aria-label="Close"
                style={{ position: 'fixed', top: 12, right: 18, background: 'transparent', border: 'none',
                         color: 'var(--bone-300)', fontSize: 30, lineHeight: 1, cursor: 'pointer',
                         fontFamily: 'system-ui, sans-serif', padding: 8, zIndex: 2 }}>✕</button>
        <video src={src} autoPlay loop controls playsInline onClick={(e) => e.stopPropagation()}
               style={{ display: 'block', width: 'auto', height: 'auto',
                        maxWidth: 'min(94vw, 860px)', maxHeight: '84vh',
                        borderRadius: 'var(--r-md)', border: '1px solid var(--border-hairline)',
                        boxShadow: '0 30px 90px rgba(0,0,0,0.7)' }} />
      </div>,
      document.body
    );
  }

  /* A silent looping clip that sits in the photo grid like any other tile. */
  function ClipTile({ src, poster, cap, pos, onOpen }) {
    const ref = useInViewLoop(src);
    const [hover, setHover] = React.useState(false);
    return (
      <figure className="nm-grain" role="button" tabIndex={0}
              onClick={onOpen}
              onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onOpen(); } }}
              onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
              aria-label={cap + ' — play the video'}
              style={{
                position: 'relative', margin: 0, borderRadius: 'var(--r-md)', overflow: 'hidden',
                cursor: 'pointer',
                border: '1px solid ' + (hover ? 'var(--ember-600)' : 'var(--border-hairline)'),
                boxShadow: hover ? 'var(--glow-ember-hot)' : 'var(--shadow-md)',
                transition: 'border-color var(--dur-med) var(--ease-out), box-shadow var(--dur-med) var(--ease-out)',
              }}>
        <video ref={ref} muted loop playsInline preload="none" poster={poster} aria-hidden="true"
               style={{ width: '100%', height: '100%', objectFit: 'cover', objectPosition: pos || 'center 40%',
                        display: 'block', filter: 'saturate(0.98) brightness(0.82)' }} />
        <div style={{ position: 'absolute', inset: 0, background: 'var(--scrim-bottom)' }} />
        <span style={{ position: 'absolute', top: 12, right: 12, zIndex: 3,
                       display: 'inline-flex', alignItems: 'center', gap: 7,
                       padding: '6px 11px', borderRadius: 'var(--r-pill)',
                       background: 'rgba(7,9,15,0.6)',
                       WebkitBackdropFilter: 'blur(8px)', backdropFilter: 'blur(8px)',
                       border: '1px solid ' + (hover ? 'var(--ember-500)' : 'var(--border-strong)'),
                       fontFamily: 'var(--font-stamp)', fontSize: 10, letterSpacing: '.16em',
                       textTransform: 'uppercase', color: hover ? 'var(--ember-glow)' : 'var(--bone-100)',
                       transition: 'all var(--dur-med) var(--ease-out)' }}>
          <span style={{ fontSize: 9, lineHeight: 1 }}>▶</span> Watch
        </span>
        <figcaption style={{ position: 'absolute', left: 14, bottom: 12, zIndex: 3,
                             fontFamily: 'var(--font-stamp)', fontSize: 11, letterSpacing: '.1em',
                             color: 'var(--bone-100)', textTransform: 'uppercase' }}>{cap}</figcaption>
      </figure>
    );
  }

  function Highlights() {
    /* One of these tiles is the short video clip (clip: true) — it loops
       silently in the grid and opens the full-screen player when clicked. */
    const [playing, setPlaying] = React.useState(false);
    const shots = [
      { src: window.BD_IMAGES.highlightArena, cap: 'Sold-out arena · 38,000 fans in attendance', tall: true },
      { src: window.BD_IMAGES.highlightShredShed, cap: 'The Shred Shed · where it started', pos: 'center 24%' },
      { clip: true, src: window.BD_VIDEOS.teaser, poster: window.BD_VIDEOS.teaserPoster,
        cap: window.BD_VIDEOS.teaserCap, pos: 'center 44%' },
    ];
    return (
      <section id="shows" style={{ padding: 'var(--section-y) 0' }}>
        <div className="nm-container">
          <SectionHeading kicker="Recent Highlights" title="Live & Loud" />
          <div style={{ display: 'grid', gridTemplateColumns: '1.4fr 1fr', gridAutoRows: '220px',
                        gap: 16, marginTop: 40 }} className="nm-highlights">
            {shots.map((s, i) => s.clip ? (
              <ClipTile key={i} src={s.src} poster={s.poster} cap={s.cap} pos={s.pos}
                        onOpen={() => setPlaying(true)} />
            ) : (
              <figure key={i} className="nm-grain" style={{
                position: 'relative', margin: 0, borderRadius: 'var(--r-md)', overflow: 'hidden',
                gridRow: s.tall ? 'span 2' : 'span 1', border: '1px solid var(--border-hairline)',
                boxShadow: 'var(--shadow-md)',
              }}>
                <img src={s.src} alt={s.cap} style={{ width: '100%', height: '100%', objectFit: 'cover', objectPosition: s.pos || 'center',
                     filter: 'saturate(0.95) brightness(0.82)' }} />
                <div style={{ position: 'absolute', inset: 0, background: 'var(--scrim-bottom)' }} />
                <figcaption style={{ position: 'absolute', left: 14, bottom: 12, zIndex: 3,
                                     fontFamily: 'var(--font-stamp)', fontSize: 11, letterSpacing: '.1em',
                                     color: 'var(--bone-100)', textTransform: 'uppercase' }}>{s.cap}</figcaption>
              </figure>
            ))}
          </div>
        </div>
        {playing && <VideoTheater src={window.BD_VIDEOS.teaser} title={window.BD_VIDEOS.title}
                                  onClose={() => setPlaying(false)} />}
      </section>
    );
  }

  Object.assign(window, { Nav, Hero, AwardsStrip, VideoBanner, Highlights });
  </script>

  <!-- Sections 2/2: Records · The Band · The Big Tour · Booking · Footer -->
  <script type="text/babel">
  /* Big Daddy and Co. — website sections (part 2): Discography, Band, Big Tour, Booking, Footer. */

  const { Wordmark: WM, Button: Btn, Stamp: Stmp, SectionHeading: SH, Card: Crd,
          AlbumCover: Album, MemberPoster: Poster, TourDate: TourRow, Field: Fld } = window.NashSMomDesignSystem_77335a;

  /* Each album: cover art (src, from the SITE PHOTO MAP) + a blurb shown when the
     cover is clicked. Edit the blurb text right here. */
  const ALBUMS = [
    { title: 'Shred Shed Sessions', year: '2022', theme: 'mono', src: window.BD_IMAGES.albumShredShedSessions,
      blurb: "The one that started it all. A stack of instruments, BBQ chicken, and stickers to show us what notes to play. No overdubs, no second takes — just the first sparks of Big Daddy and Co. caught raw on tape. You can still hear the space heater humming under track three." },
    { title: 'Backwrds & Barefoot', year: '2023', theme: 'ember', src: window.BD_IMAGES.albumBackwardsBarefoot,
      blurb: "Caps turned backwards, shoes left at the door. The record where the band found its swagger — a wall of keys, a rhythm section that won't quit, and choruses built for sweaty rooms. Recorded mostly barefoot, entirely on purpose." },
    { title: 'Pretzel Sunday', year: '2024', theme: 'flag', src: window.BD_IMAGES.albumPretzelSunday,
      blurb: "Born from the legend of the Pretzel King: 48 soft pretzels in 5 minutes, before being let loose on the city of Cleveland with a cash prize. This is the most fun we've ever had pressing record. Best served with mustard." },
    { title: 'Big Kit', year: '2025', theme: 'volt', src: window.BD_IMAGES.albumBigKit,
      blurb: "Full battle rattle, zero deployment. Helmet on, plate carrier cinched over a band tee, sweatpants bloused into fresh white kicks — tracked from the bedroom floor while a galaxy bled through the drywall. 'Big Kit' is the sound of maximum gear and minimum chill: thunderous low end, more hardware than sense, and a drummer who took 'what's your setup?' a little too literally. Suit up, stand down, hit record." },
    { title: 'Arena Sized', year: '2026', theme: 'volt', src: window.BD_IMAGES.albumArenaSized,
      blurb: "From the Shred Shed to arena tours with attendances averaging thirty-eight thousand strong. The biggest, boldest Big Daddy and Co. record yet — built for the back row and the world tour that follows it. Turn it up until the neighbors book us too." },
  ];

  /* The enlarge-on-click overlay: big cover + the album's blurb. Rendered into
     <body> via a portal so it always fills the screen. Close via backdrop, ✕, or Esc. */
  function AlbumModal({ album, onClose }) {
    const accent = { ember: 'var(--ember-glow)', volt: 'var(--volt-glow)', flag: 'var(--rouge-500)', mono: 'var(--bone-300)' }[album.theme] || 'var(--ember-glow)';
    React.useEffect(() => {
      const onKey = (e) => { if (e.key === 'Escape') onClose(); };
      document.addEventListener('keydown', onKey);
      const prev = document.documentElement.style.overflow;
      document.documentElement.style.overflow = 'hidden';
      return () => { document.removeEventListener('keydown', onKey); document.documentElement.style.overflow = prev; };
    }, [onClose]);
    return ReactDOM.createPortal(
      <div onClick={onClose} role="dialog" aria-modal="true" aria-label={album.title + ' — album details'}
           style={{ position: 'fixed', inset: 0, zIndex: 10001, display: 'flex', alignItems: 'center',
                    justifyContent: 'center', padding: 'clamp(20px,5vw,56px)', background: 'rgba(7,9,15,0.93)',
                    WebkitBackdropFilter: 'blur(6px)', backdropFilter: 'blur(6px)', cursor: 'zoom-out' }}>
        <button onClick={onClose} aria-label="Close"
                style={{ position: 'fixed', top: 12, right: 18, background: 'transparent', border: 'none',
                         color: 'var(--bone-300)', fontSize: 30, lineHeight: 1, cursor: 'pointer',
                         fontFamily: 'system-ui, sans-serif', padding: 8, zIndex: 2 }}>✕</button>
        <div onClick={(e) => e.stopPropagation()} className="nm-album-modal"
             style={{ display: 'grid', gridTemplateColumns: 'minmax(0,1fr) minmax(0,1fr)', gap: 'clamp(24px,4vw,48px)',
                      alignItems: 'center', width: '100%', maxWidth: 940, cursor: 'default' }}>
          <img src={album.src} alt={album.title + ' album cover'}
               style={{ display: 'block', justifySelf: 'center', maxWidth: '100%', maxHeight: '78vh',
                        width: 'auto', height: 'auto', objectFit: 'contain', borderRadius: 'var(--r-md)',
                        border: '1px solid var(--border-hairline)', boxShadow: '0 30px 90px rgba(0,0,0,0.7)' }} />
          <div>
            <div style={{ fontFamily: 'var(--font-stamp)', fontSize: 11, letterSpacing: '.2em',
                          textTransform: 'uppercase', color: accent }}>Big Daddy &amp; Co. · The Records</div>
            <h3 style={{ fontFamily: 'var(--font-display)', textTransform: 'uppercase', lineHeight: 0.92,
                         letterSpacing: '-0.01em', fontSize: 'clamp(34px,4.6vw,58px)', color: 'var(--bone-100)',
                         margin: '10px 0 8px' }}>{album.title}</h3>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 20 }}>
              <span style={{ width: 28, height: 2, background: accent }} />
              <span style={{ fontFamily: 'var(--font-stamp)', fontSize: 12, letterSpacing: '.16em',
                             color: 'var(--bone-400)', textTransform: 'uppercase' }}>Released {album.year}</span>
            </div>
            <p style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--fs-lead)', lineHeight: 1.55,
                        color: 'var(--bone-300)', margin: 0, maxWidth: 460 }}>{album.blurb}</p>
          </div>
        </div>
      </div>,
      document.body
    );
  }

  function Discography() {
    const [active, setActive] = React.useState(null);
    return (
      <section id="records" className="nm-grain" style={{
        position: 'relative', padding: 'var(--section-y) 0', background: 'var(--stage-black)',
        borderTop: '1px solid var(--border-hairline)', overflow: 'hidden',
      }}>
        <div style={{ position: 'absolute', inset: 0, background: 'var(--spot-ember)', opacity: 0.6 }} />
        <div className="nm-container" style={{ position: 'relative', zIndex: 2 }}>
          <SectionHeading kicker="Discography" title="The Records" align="center" glow style={{ marginInline: 'auto' }} />
          <p style={{ fontFamily: 'var(--font-stamp)', fontSize: 12, letterSpacing: '.16em', textTransform: 'uppercase',
                      color: 'var(--bone-400)', textAlign: 'center', marginTop: 16 }}>
            Tap any cover for the story behind the record
          </p>
          <div style={{ display: 'flex', gap: 'clamp(20px,4vw,56px)', justifyContent: 'center',
                        flexWrap: 'wrap', marginTop: 48 }}>
            {ALBUMS.map((a, i) => (
              <div key={i} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 14 }}>
                <Album {...a} year="" delay={i * 0.5} size={190} onClick={() => setActive(a)} />
                <div style={{ textAlign: 'center' }}>
                  <div style={{ fontFamily: 'var(--font-heading)', fontWeight: 600, fontSize: 16,
                                color: 'var(--bone-100)', textTransform: 'uppercase', letterSpacing: '.04em' }}>{a.title}</div>
                  <div style={{ fontFamily: 'var(--font-stamp)', fontSize: 11, color: 'var(--bone-400)', letterSpacing: '.1em' }}>{a.year}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
        {active && <AlbumModal album={active} onClose={() => setActive(null)} />}
      </section>
    );
  }

  const MEMBERS = [
    { src: window.BD_IMAGES.memberTimNash, nickname: 'The Keyboard Commando', name: 'Tim', instrument: "Keys · Deborah's Son" },
    { src: window.BD_IMAGES.memberDylanMerriman, nickname: 'The Bass Legend', name: 'Dylan', instrument: 'Bass' },
    { src: window.BD_IMAGES.memberDirtyMike, nickname: 'On the Strings', name: 'Dirty Mike', instrument: 'Guitar' },
    { src: window.BD_IMAGES.memberTyler, nickname: 'On the Drums', name: 'Tyler', instrument: 'Drums' },
  ];

  function TheBand() {
    return (
      <section id="theband" style={{ padding: 'var(--section-y) 0' }}>
        <div className="nm-container">
          <SectionHeading kicker="Wanted: Alive & On Stage" title="The Band" />
          <div className="nm-members" style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(150px, 1fr))',
                        gap: 20, marginTop: 40 }}>
            {MEMBERS.map((m, i) => (
              <figure key={i} style={{ margin: 0, aspectRatio: '4 / 7', borderRadius: 'var(--r-sm)',
                       overflow: 'hidden', border: '1px solid var(--border-hairline)',
                       boxShadow: 'var(--shadow-lg)', background: 'var(--stage-black)' }}>
                <img src={m.src} alt={m.name} style={{ width: '100%', height: '100%',
                     objectFit: 'contain', display: 'block' }} />
              </figure>
            ))}
          </div>
        </div>
      </section>
    );
  }

  /* THE BIG TOUR
     Every date carries its year, and anything before today is drawn as a
     struck-out "Played" row automatically — so the schedule stays current
     on its own. Add new dates in the same shape; `status` is one of
     'soldout' | 'lowtix' | 'onsale'. */
  const TOUR_MONTHS = { JAN: 0, FEB: 1, MAR: 2, APR: 3, MAY: 4, JUN: 5,
                        JUL: 6, AUG: 7, SEP: 8, OCT: 9, NOV: 10, DEC: 11 };

  function hasPlayed(t) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    return new Date(t.year, TOUR_MONTHS[t.month], Number(t.day)) < today;
  }

  /* A date that's already in the books: struck through, dimmed, no tickets. */
  function PlayedDate({ month, day, city, venue }) {
    const strike = { textDecoration: 'line-through', textDecorationColor: 'var(--bone-400)' };
    return (
      <div style={{ display: 'grid', gridTemplateColumns: '84px 1fr auto auto', alignItems: 'center',
                    gap: 'var(--sp-5)', padding: '18px var(--sp-5)',
                    borderBottom: '1px solid var(--border-hairline)', opacity: 0.45 }}>
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', lineHeight: 1 }}>
          <span style={{ fontFamily: 'var(--font-stamp)', fontSize: 12, letterSpacing: '.12em',
                         color: 'var(--bone-400)', textTransform: 'uppercase', ...strike }}>{month}</span>
          <span style={{ fontFamily: 'var(--font-display)', fontSize: 40, color: 'var(--bone-300)', ...strike }}>{day}</span>
        </div>
        <div style={{ minWidth: 0 }}>
          <div style={{ fontFamily: 'var(--font-heading)', fontWeight: 600, fontSize: 22,
                        color: 'var(--bone-300)', textTransform: 'uppercase', letterSpacing: '.01em', ...strike }}>{city}</div>
          <div style={{ fontFamily: 'var(--font-body)', fontSize: 15, color: 'var(--bone-400)', ...strike }}>{venue}</div>
        </div>
        <div><Stmp tone="sold" rotate={-2}>Played</Stmp></div>
        <div><Btn variant="ghost" size="sm" as="button" disabled>Past Show</Btn></div>
      </div>
    );
  }

  const TOUR = [
    { year: 2026, month: 'JUL', day: '06', city: 'Shaker Hts, OH', venue: 'The Shred Shed', status: 'soldout' },
    { year: 2026, month: 'JUL', day: '13', city: 'Shaker Hts, OH', venue: 'The Shred Shed', status: 'lowtix' },
    { year: 2026, month: 'JUL', day: '20', city: 'Shaker Hts, OH', venue: 'The Shred Shed', status: 'lowtix' },
    { year: 2026, month: 'JUL', day: '27', city: 'Shaker Hts, OH', venue: 'The Shred Shed', status: 'lowtix' },
    { year: 2026, month: 'AUG', day: '08', city: 'New York, NY', venue: 'Madison Square Garden', status: 'soldout' },
    { year: 2026, month: 'AUG', day: '09', city: 'New York, NY', venue: 'Madison Square Garden', status: 'soldout' },
    { year: 2026, month: 'AUG', day: '12', city: 'East Rutherford, NJ', venue: 'MetLife Stadium', status: 'lowtix' },
    { year: 2026, month: 'AUG', day: '23', city: 'Chicago, IL', venue: 'Soldier Field', status: 'onsale' },
    { year: 2026, month: 'SEP', day: '05', city: 'Nashville, TN', venue: 'Ryman Auditorium', status: 'lowtix' },
    { year: 2026, month: 'SEP', day: '13', city: 'Morrison, CO', venue: 'Red Rocks Amphitheatre', status: 'soldout' },
    { year: 2026, month: 'SEP', day: '20', city: 'George, WA', venue: 'The Gorge Amphitheatre', status: 'onsale' },
    { year: 2026, month: 'SEP', day: '27', city: 'Los Angeles, CA', venue: 'Hollywood Bowl', status: 'onsale' },
    { year: 2026, month: 'SEP', day: '28', city: 'Los Angeles, CA', venue: 'Four Seasons Landscaping', status: 'soldout' },
    { year: 2026, month: 'OCT', day: '11', city: 'Inglewood, CA', venue: 'SoFi Stadium', status: 'soldout' },
    { year: 2026, month: 'OCT', day: '12', city: 'Inglewood, CA', venue: 'SoFi Stadium', status: 'lowtix' },
    { year: 2026, month: 'OCT', day: '20', city: 'Las Vegas, NV', venue: 'The Sphere', status: 'onsale' },
  ];

  function BigTour({ onTickets }) {
    const upcoming = TOUR.filter((t) => !hasPlayed(t));
    const range = upcoming.length
      ? upcoming[0].month + ' \u2013 ' + upcoming[upcoming.length - 1].month + ' ' + upcoming[0].year
      : 'That\u2019s a wrap';
    const count = upcoming.length
      ? upcoming.length + ' Shows Left \u00b7 All Ages'
      : 'Tour Wrapped \u00b7 Thank You';
    return (
      <section id="tour" className="nm-grain" style={{
        position: 'relative', padding: 'var(--section-y) 0', background: 'var(--surface-raised)',
        borderTop: '1px solid var(--border-hairline)', borderBottom: '1px solid var(--border-hairline)',
      }}>
        <div className="nm-container" style={{ position: 'relative', zIndex: 2 }}>
          <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between',
                        flexWrap: 'wrap', gap: 16 }}>
            <SectionHeading kicker={range} title="The Big Tour" />
            <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 12 }}><img src="assets/brand/big-daddy-logo-badge.svg" alt="Big Daddy and Co. - Live from the Shred Shed" className="nm-tour-badge" style={{ width: 210, height: 210, display: 'block', filter: 'drop-shadow(0 12px 46px rgba(240,138,29,0.45))' }} /><Stmp tone="ember" rotate={-2} style={{ fontSize: 13 }}>{count}</Stmp></div>
          </div>
          <div style={{ marginTop: 40, borderTop: '1px solid var(--border-hairline)' }}>
            {TOUR.map((t, i) => hasPlayed(t)
              ? <PlayedDate key={i} {...t} />
              : <TourRow key={i} {...t} onTickets={onTickets} />)}
          </div>
          <p style={{ fontFamily: 'var(--font-body)', fontSize: 14, color: 'var(--bone-400)', marginTop: 20 }}>
            More dates added weekly — international and Icelandic leg announced this fall. Want us in your city?{' '}
            <a href="#book" style={{ color: 'var(--ember-glow)' }}>Get in touch.</a>
          </p>
        </div>
      </section>
    );
  }

  function Booking({ submitted, onSubmit }) {
    return (
      <section id="book" style={{ padding: 'var(--section-y) 0' }}>
        <div className="nm-container" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr',
                                               gap: 'clamp(32px,5vw,80px)', alignItems: 'start' }} className="nm-booking">
          <div>
            <SectionHeading kicker="Book Us" title={<span>Bring The<br/>Big Tour Home</span>} />
            <p style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--fs-lead)', color: 'var(--bone-300)',
                        marginTop: 22, maxWidth: 440, lineHeight: 1.5 }}>
              Festivals, clubs, weddings, backyard pretzel parties — if there's a stage and a crowd,
              we'll be there. Tell us about the gig and our team will get back to you within 48 hours.
            </p>
            <div style={{ display: 'flex', gap: 10, marginTop: 28, flexWrap: 'wrap' }}>
              <Stmp tone="bone">No venue too small</Stmp>
              <Stmp tone="bone">Will travel</Stmp>
              <Stmp tone="bone">Have keys, will play</Stmp>
            </div>
          </div>
          <Crd padding="clamp(24px,3vw,40px)">
            {submitted ? (
              <div style={{ textAlign: 'center', padding: '40px 0' }}>
                <div style={{ fontFamily: 'var(--font-display)', fontSize: 44, color: 'var(--ember-glow)',
                              textTransform: 'uppercase', lineHeight: 0.9 }}>You're In!</div>
                <p style={{ color: 'var(--bone-300)', marginTop: 16 }}>Request received. We'll be in touch within 48 hours. Keep it loud.</p>
              </div>
            ) : (
              <form onSubmit={(e) => { e.preventDefault(); onSubmit(); }}
                    style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
                  <Fld label="Your Name" placeholder="Jane Promoter" required />
                  <Fld label="Email" type="email" placeholder="you@venue.com" required />
                </div>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
                  <Fld label="Venue / City" placeholder="Madison Square Garden" required />
                  <Fld label="Event Type" type="select" options={[
                    { value: 'club', label: 'Club / Bar' },
                    { value: 'festival', label: 'Festival' },
                    { value: 'private', label: 'Private / Wedding' },
                    { value: 'arena', label: 'Arena / Theater' },
                    { value: 'basement', label: 'Backyard / Basement' },
                  ]} />
                </div>
                <Fld label="Tell Us About The Gig" type="textarea" rows={4}
                     placeholder="Date, capacity, budget range, and how loud you want it." />
                <Btn variant="primary" size="lg" as="button" type="submit" style={{ width: '100%' }}>Send Booking Request</Btn>
              </form>
            )}
          </Crd>
        </div>
      </section>
    );
  }

  function Footer() {
    return (
      <footer className="nm-grain" style={{ position: 'relative', background: 'var(--stage-black)',
              borderTop: '1px solid var(--border-hairline)', padding: '56px 0 36px' }}>
        <div className="nm-container" style={{ position: 'relative', zIndex: 2 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start',
                        flexWrap: 'wrap', gap: 28 }}>
            <div>
              <img src="assets/brand/big-daddy-wordmark.svg" alt="Big Daddy and Co." style={{ height: 40, width: 'auto', display: 'block' }} />
              <p style={{ fontFamily: 'var(--font-stamp)', fontSize: 11, letterSpacing: '.14em',
                          color: 'var(--bone-400)', marginTop: 14, textTransform: 'uppercase' }}>
                Live from the Shred Shed to the world.
              </p>
            </div>
            <div style={{ display: 'flex', gap: 48, flexWrap: 'wrap' }}>
              {[['Listen', ['Spotify', 'Apple Music', 'Bandcamp', 'YouTube']],
                ['Follow', ['Instagram', 'TikTok', 'X / Twitter']],
                ['Band', ['Tour', 'Merch', 'Press Kit', 'Book Us']]].map(([h, items]) => (
                <div key={h}>
                  <div style={{ fontFamily: 'var(--font-heading)', fontWeight: 600, fontSize: 13,
                                textTransform: 'uppercase', letterSpacing: '.14em', color: 'var(--ember-500)', marginBottom: 12 }}>{h}</div>
                  {items.map((it) => (
                    <a key={it} href="#" style={{ display: 'block', fontSize: 14, color: 'var(--bone-300)',
                       marginBottom: 8 }}
                       onMouseEnter={(e) => e.target.style.color = 'var(--bone-100)'}
                       onMouseLeave={(e) => e.target.style.color = 'var(--bone-300)'}>{it}</a>
                  ))}
                </div>
              ))}
            </div>
          </div>
          <div style={{ marginTop: 40, paddingTop: 20, borderTop: '1px solid var(--border-hairline)',
                        display: 'flex', justifyContent: 'space-between', flexWrap: 'wrap', gap: 10,
                        fontFamily: 'var(--font-stamp)', fontSize: 10, letterSpacing: '.12em',
                        color: 'var(--bone-400)', textTransform: 'uppercase' }}>
            <span>© 2026 Big Daddy and Co. · All rights reserved</span>
            <span>Booking · management@bigdaddyandco.com</span>
          </div>
        </div>
      </footer>
    );
  }

  Object.assign(window, { Discography, TheBand, BigTour, Booking, Footer });
  </script>

  <!-- App shell: assembles the sections and renders the page -->
  <script type="text/babel">
  function App() {
        const [submitted, setSubmitted] = React.useState(false);
        const scrollTo = (id) => { const el = document.getElementById(id); if (el) window.scrollTo({ top: el.offsetTop - 60, behavior: 'smooth' }); };
        return (
          <React.Fragment>
            <Nav onBook={() => scrollTo('tour')} />
            <Hero onTickets={() => scrollTo('tour')} onBook={() => scrollTo('book')} />
            <AwardsStrip />
            <VideoBanner />
            <Highlights />
            <Discography />
            <TheBand />
            <BigTour onTickets={() => scrollTo('book')} />
            <Booking submitted={submitted} onSubmit={() => setSubmitted(true)} />
            <Footer />
          </React.Fragment>
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <!-- Tap-to-enlarge lightbox for photos -->
  <div id="bd-lightbox" aria-hidden="true"><img alt=""></div>
  <script src="assets/js/lightbox.js"></script>
</body>
</html>
