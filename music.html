<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music · Big Daddy and Co.</title>

  <!-- =======================================================================
       THE MUSIC PAGE

       To put a song up, scroll to the bottom of this page on the live site,
       type the band word, and pick the file. That's it. Nothing in this file
       needs touching.

       (The hand-edited list in assets/data/catalog.js still works too, for
       anything you'd rather wire up by hand.)

       Full instructions: EDITING.md, "Putting music and videos up".
       ======================================================================= -->

  <!-- Brand kit: icons, PWA manifest, social cards -->
  <link rel="icon" href="assets/brand/big-daddy-favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/brand/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/brand/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <link rel="manifest" href="assets/brand/site.webmanifest">
  <meta name="theme-color" content="#0B0E16">
  <meta name="description" content="Every Big Daddy and Co. recording, in one place. Play it here, or take a loop over to the jam page and build on it.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Music — Big Daddy and Co.">
  <meta property="og:description" content="Every Big Daddy and Co. recording, in one place.">
  <meta property="og:url" content="https://bigdaddyand.co/music.html">
  <meta property="og:image" content="https://bigdaddyand.co/assets/brand/big-daddy-og-banner.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://bigdaddyand.co/assets/brand/big-daddy-og-banner.png">

  <!-- What stands in for album art when a record hasn't got any (the
       "Singles" group, for one): a clip that loops silently, like a gif.
       Both files live in assets/video/. Set `loop` to null for a plain
       tile with the album name on it. -->
  <script>
    window.BD_MUSIC = {
      artFallback: {
        loop:   "assets/video/chasing-big-daddy-banner.mp4",
        poster: "assets/video/chasing-big-daddy-banner-poster.jpg"
      }
    };
  </script>

  <!-- Styles: design system, page overrides, then this page's own bits -->
  <link rel="stylesheet" href="assets/css/site.css">
  <link rel="stylesheet" href="assets/css/enhance.css">
  <link rel="stylesheet" href="assets/css/media.css">
</head>
<body>
  <div id="root"></div>

  <!-- Libraries (vendored locally so the site works offline / from file://) -->
  <script src="assets/js/react.production.min.js"></script>
  <script src="assets/js/react-dom.production.min.js"></script>
  <script src="assets/js/babel.min.js"></script>

  <!-- Reusable design-system components (Button, Card, Stamp, …) -->
  <script src="assets/js/design-system.js"></script>

  <!-- The top bar, shared with every other page. -->
  <script src="assets/js/site-nav.js"></script>

  <!-- The library itself, and the helper that resolves bucket keys. -->
  <script src="assets/data/catalog.js"></script>
  <script src="assets/js/catalog.js"></script>

  <script type="text/babel">
  /* Big Daddy and Co. — the music page.

     One <audio> element for the whole page, held in a ref. Giving every
     track its own would mean two songs playing over each other the moment
     somebody clicks a second one. */

  const { Button, Stamp, SectionHeading, Card, Field } = window.NashSMomDesignSystem_77335a;
  const SiteNav = window.BDNav.Nav;
  const Catalog = window.BDCatalog;

  /* ---- art for a record that hasn't got any ------------------------
     A clip looping silently in the square where the cover would be. It
     only plays while it's on screen, and not at all for people who've
     asked their system for less motion — they get the poster. */
  function ArtLoop({ name }) {
    const fb = (window.BD_MUSIC && window.BD_MUSIC.artFallback) || {};
    const ref = React.useRef(null);

    React.useEffect(() => {
      const el = ref.current;
      if (!el || !fb.loop) return;
      const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduced) return;
      const io = new IntersectionObserver(([entry]) => {
        if (!entry) return;
        if (entry.isIntersecting) {
          if (!el.getAttribute('src')) el.setAttribute('src', fb.loop);
          const p = el.play(); if (p && p.catch) p.catch(() => {});
        } else {
          el.pause();
        }
      }, { threshold: 0.15 });
      io.observe(el);
      return () => io.disconnect();
    }, [fb.loop]);

    if (!fb.loop) return <div className="md-album-blank" aria-hidden="true">{name}</div>;

    return (
      <div className="md-album-loop" aria-hidden="true">
        <video ref={ref} muted loop playsInline preload="none"
               poster={fb.poster} tabIndex={-1} disablePictureInPicture />
        <span className="md-album-loop-label">{name}</span>
      </div>
    );
  }

  /* ---- one row in the list --------------------------------------- */
  function Track({ track, active, playing, progress, onToggle, onSeek }) {
    const pct = active && track.duration_s ? (progress / track.duration_s) * 100 : 0;

    return (
      <li className={'md-track' + (active ? ' is-active' : '')}>
        <button type="button" className="md-play"
                aria-label={(playing ? 'Pause ' : 'Play ') + track.title}
                onClick={onToggle}>
          {playing ? '❚❚' : '▶'}
        </button>

        <div className="md-track-body">
          <p className="md-track-title">{track.title}</p>
          <p className="md-track-meta">
            {[track.album, track.year].filter(Boolean).join(' · ')}
          </p>
          {track.blurb && <p className="md-track-blurb">{track.blurb}</p>}

          {/* A scrubber, but only for the track actually playing — an
              inert bar under every row would just be decoration. */}
          {active ? (
            <input className="md-scrub" type="range" min="0" step="0.1"
                   max={track.duration_s || 0}
                   value={Math.min(progress, track.duration_s || 0)}
                   aria-label={'Seek within ' + track.title}
                   onChange={(ev) => onSeek(Number(ev.target.value))} />
          ) : (
            <div className="md-bar" aria-hidden="true"><span style={{ width: pct + '%' }} /></div>
          )}
        </div>

        <span className="md-track-time">
          {active ? Catalog.duration(progress) + ' / ' : ''}{Catalog.duration(track.duration_s)}
        </span>
      </li>
    );
  }

  /* ---- putting a song up ------------------------------------------
     Folded away behind one line at the bottom of the page. Needs the
     band word once; after that the browser remembers, same as the jam
     board. The file goes straight from here into the bucket and the
     row is written when it lands, so the new song shows up on this
     page — and for everyone else — the moment the bar fills. */
  function fileSize(bytes) {
    return bytes < 1048576 ? Math.round(bytes / 1024) + ' KB' : (Math.round(bytes / 104857.6) / 10) + ' MB';
  }

  function AddSong({ albums, onAdded }) {
    const [open, setOpen] = React.useState(false);
    const [mayPost, setMayPost] = React.useState(false);
    const [passphrase, setPassphrase] = React.useState('');
    const [file, setFile] = React.useState(null);
    const [art, setArt] = React.useState(null);
    const [title, setTitle] = React.useState('');
    const [album, setAlbum] = React.useState('');
    const [year, setYear] = React.useState(String(new Date().getFullYear()));
    const [blurb, setBlurb] = React.useState('');
    const [credits, setCredits] = React.useState('');
    const [seconds, setSeconds] = React.useState(null);
    const [busy, setBusy] = React.useState(false);
    const [progress, setProgress] = React.useState(null);   // 0..1 while uploading
    const [error, setError] = React.useState(null);
    const [done, setDone] = React.useState(null);           // the song just added
    // Bumped after a successful upload: file inputs can't be set from code,
    // so the Fields are remounted empty instead (Field is a plain function
    // component and can't take a ref).
    const [generation, setGeneration] = React.useState(0);

    React.useEffect(() => {
      if (!Catalog.api.ready) return;
      Catalog.api.mayPost().then((r) => setMayPost(!!r.may_post)).catch(() => {});
    }, []);

    function pickFile(ev) {
      const f = ev.target.files && ev.target.files[0];
      setFile(f || null);
      setSeconds(null);
      setDone(null);
      if (!f) return;
      // "4 Minute Clinic.m4a" -> "4 Minute Clinic", unless a name was typed already.
      if (!title.trim()) setTitle(f.name.replace(/\.[a-z0-9]+$/i, '').replace(/_+/g, ' ').trim());
      Catalog.measure(f).then(setSeconds);
    }

    async function submit(ev) {
      ev.preventDefault();
      setError(null);
      setDone(null);
      if (!file) { setError('Pick the audio file first.'); return; }
      if (!title.trim()) { setError('Give it a name so people know what they are clicking.'); return; }

      setBusy(true);
      try {
        if (!mayPost) {
          if (!passphrase.trim()) { setError('You need the band word to put a song up.'); setBusy(false); return; }
          await Catalog.api.signIn(passphrase.trim());
          setMayPost(true);
          setPassphrase('');
        }

        /* Artwork first, so the song can point at it from the moment it
           exists. It's a small file, so it gets a sliver of the bar. */
        let cover = null;
        if (art) {
          setProgress(0);
          cover = (await Catalog.api.uploadArt(art, (p) => setProgress(p * 0.1))).key;
        }

        setProgress(art ? 0.1 : 0);
        const result = await Catalog.api.uploadTrack(file, {
          title: title.trim(),
          album: album.trim() || null,
          year: year.trim() || null,
          blurb: blurb.trim() || null,
          credits: credits.trim() || null,
          duration_s: seconds,
          cover
        }, (p) => setProgress(art ? 0.1 + p * 0.9 : p));

        onAdded(result.item);
        setDone(result.item);
        setFile(null); setArt(null); setTitle(''); setBlurb(''); setSeconds(null);
        setGeneration((g) => g + 1);
      } catch (err) {
        setError(err.message || 'That did not work.');
      } finally {
        setBusy(false);
        setProgress(null);
      }
    }

    if (!open) {
      return (
        <section className="md-add">
          <p className="md-add-line">
            {mayPost ? 'Band members: ' : 'Got the band word? '}
            <button type="button" className="md-add-toggle" onClick={() => setOpen(true)}>
              {mayPost ? 'Add a song' : 'Put a song up'}
            </button>
          </p>
        </section>
      );
    }

    const knownAlbum = !!album.trim() && albums.indexOf(album.trim()) !== -1;

    return (
      <section className="md-add" aria-labelledby="md-add-heading">
        <Card>
          <div className="md-add-head">
            <div>
              <Stamp>For the band</Stamp>
              <h2 id="md-add-heading" className="md-add-title">Put a song up</h2>
            </div>
            <button type="button" className="md-add-toggle" onClick={() => setOpen(false)}>Close</button>
          </div>

          {!Catalog.api.ready ? (
            <p className="md-empty">
              Uploading only works on the live site — open{' '}
              <a href="https://bigdaddyand.co/music.html">bigdaddyand.co/music.html</a> and
              do it from there.
            </p>
          ) : (
            <form className="md-form" onSubmit={submit} noValidate>
              <Field label="The song" required type="file"
                     accept="audio/*,.m4a,.mp3,.wav,.ogg,.flac,.aac"
                     hint={file
                       ? fileSize(file.size) + (seconds ? ' · ' + Catalog.duration(seconds) : '')
                       : 'MP3, M4A, WAV, OGG or FLAC — straight off the phone is fine.'}
                     key={'song-' + generation} onChange={pickFile} />

              <div className="md-form-row">
                <Field label="Title" required placeholder="What it's called" maxLength={120}
                       value={title} onChange={(ev) => setTitle(ev.target.value)} />
                <Field label="Year" type="number" min="1900" max="2100" style={{ maxWidth: 140 }}
                       value={year} onChange={(ev) => setYear(ev.target.value)} />
              </div>

              <Field label="Album" placeholder="Leave blank for a single" maxLength={120}
                     hint="Songs with the same album name are grouped together and share its artwork."
                     list="md-albums"
                     value={album} onChange={(ev) => setAlbum(ev.target.value)} />
              <datalist id="md-albums">
                {albums.map((a) => <option key={a} value={a} />)}
              </datalist>

              <Field label="A line about it" type="textarea" rows={2} maxLength={500}
                     placeholder="Where it came from, what it's about — optional."
                     value={blurb} onChange={(ev) => setBlurb(ev.target.value)} />

              <Field label="Credits" placeholder="Who played what — optional." maxLength={300}
                     value={credits} onChange={(ev) => setCredits(ev.target.value)} />

              <Field label="Artwork" type="file" accept="image/jpeg,image/png,image/webp"
                     hint={knownAlbum
                       ? 'Optional — this album already has artwork, which the song will use.'
                       : 'Optional. A square JPEG or PNG; the album gets it, not just this song.'}
                     key={'art-' + generation}
                     onChange={(ev) => setArt((ev.target.files && ev.target.files[0]) || null)} />

              {!mayPost && (
                <Field label="The band word" required type="password"
                       autoComplete="current-password"
                       hint="Typed once — this browser remembers it after that."
                       placeholder="The same word the jam board uses"
                       value={passphrase} onChange={(ev) => setPassphrase(ev.target.value)} />
              )}

              {progress !== null && (
                <div className="md-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"
                     aria-valuenow={Math.round(progress * 100)}>
                  <span style={{ width: Math.round(progress * 100) + '%' }} />
                </div>
              )}

              {error && <p className="md-error" role="alert">{error}</p>}
              {done && (
                <p className="md-done" role="status">
                  <strong>{done.title}</strong> is up. It's on this page now, for everyone.
                </p>
              )}

              <div className="md-form-actions">
                <Button type="submit" variant="primary" disabled={busy}>
                  {busy ? (progress !== null ? 'Uploading… ' + Math.round(progress * 100) + '%' : 'One sec…') : 'Put it up'}
                </Button>
                <span className="md-fineprint">
                  Anyone with the link can play it once it's up. Don't put unreleased material here.
                </span>
              </div>
            </form>
          )}
        </Card>
      </section>
    );
  }

  function MusicPage() {
    const [tracks, setTracks] = React.useState(null);   // null = still loading
    const [activeSlug, setActiveSlug] = React.useState(null);
    const [playing, setPlaying] = React.useState(false);
    const [progress, setProgress] = React.useState(0);
    const [error, setError] = React.useState(null);
    const audioRef = React.useRef(null);

    React.useEffect(() => { Catalog.load('tracks').then(setTracks); }, []);

    /* A song just uploaded from this page goes straight into the list —
       no reload, and no waiting on the API to come round. */
    function addTrack(item) {
      setTracks((list) => [Catalog.prepare(item)].concat(list || []));
    }

    /* A length the uploader couldn't measure gets filled in the first
       time the track plays, from the file itself. */
    function learnDuration(slug, secs) {
      if (!secs || !isFinite(secs)) return;
      setTracks((list) => (list || []).map((t) =>
        t.slug === slug && !t.duration_s ? Object.assign({}, t, { duration_s: secs }) : t));
    }

    const albums = React.useMemo(() => {
      const names = [];
      (tracks || []).forEach((t) => { if (t.album && names.indexOf(t.album) === -1) names.push(t.album); });
      return names;
    }, [tracks]);

    const active = tracks && tracks.filter((t) => t.slug === activeSlug)[0];

    /* Album art is the page's only real image weight, so the list is
       grouped by record rather than repeating the cover on every row. */
    const groups = React.useMemo(() => {
      if (!tracks) return [];
      const order = [];
      const byAlbum = {};
      tracks.forEach((t) => {
        const key = t.album || 'Singles';
        if (!byAlbum[key]) { byAlbum[key] = { name: key, cover: t.cover, year: t.year, tracks: [] }; order.push(key); }
        byAlbum[key].tracks.push(t);
      });
      return order.map((k) => byAlbum[k]);
    }, [tracks]);

    function toggle(track) {
      const audio = audioRef.current;
      if (!audio) return;

      if (activeSlug === track.slug) {
        if (audio.paused) { audio.play().catch(() => setError('That track would not start.')); }
        else audio.pause();
        return;
      }

      setError(null);
      setActiveSlug(track.slug);
      setProgress(0);
      audio.src = track.src;
      audio.play().catch(() => setError('That track would not start. It may still be uploading.'));
    }

    function seek(seconds) {
      const audio = audioRef.current;
      if (audio) { audio.currentTime = seconds; setProgress(seconds); }
    }

    return (
      <React.Fragment>
        <SiteNav current="music" cta={{ label: 'Book Us', href: 'index.html#book' }} />

        <main className="md-page">
          <header className="md-hero">
            <Stamp>The Records</Stamp>
            <h1 className="md-hero-title">Music</h1>
            <p className="md-hero-blurb">
              Everything we've put down. Play it here, then go{' '}
              <a href="jam.html">build something on the jam page</a> — the wall over
              there is where the half-finished ideas live.
            </p>
          </header>

          {tracks === null && <p className="md-empty">Fetching the records…</p>}

          {tracks && !tracks.length && (
            <Card>
              <p className="md-empty">
                Nothing up here yet. When there is, it'll be right on this page —
                and in the meantime the <a href="videos.html">videos</a> and the{' '}
                <a href="jam.html">jam board</a> are worth a look.
              </p>
            </Card>
          )}

          {error && <p className="md-error" role="alert">{error}</p>}

          {groups.map((group) => (
            <section key={group.name} className="md-album">
              <div className="md-album-art">
                {group.cover
                  ? <img src={group.cover} alt={'Cover of ' + group.name} loading="lazy" />
                  : <ArtLoop name={group.name} />}
              </div>
              <div className="md-album-body">
                <h2 className="md-album-title">{group.name}</h2>
                {group.year && <p className="md-album-year">{group.year}</p>}
                <ul className="md-tracks">
                  {group.tracks.map((track) => (
                    <Track
                      key={track.slug}
                      track={track}
                      active={activeSlug === track.slug}
                      playing={activeSlug === track.slug && playing}
                      progress={activeSlug === track.slug ? progress : 0}
                      onToggle={() => toggle(track)}
                      onSeek={seek}
                    />
                  ))}
                </ul>
              </div>
            </section>
          ))}

          {tracks !== null && <AddSong albums={albums} onAdded={addTrack} />}
        </main>

        {/* One player for the page. preload="none" so opening the page
            doesn't start pulling audio nobody asked for. */}
        <audio
          ref={audioRef}
          preload="none"
          onPlay={() => setPlaying(true)}
          onPause={() => setPlaying(false)}
          onEnded={() => { setPlaying(false); setProgress(0); }}
          onTimeUpdate={(ev) => setProgress(ev.target.currentTime)}
          onLoadedMetadata={(ev) => learnDuration(activeSlug, ev.target.duration)}
          onError={() => { if (activeSlug) setError('That track could not be loaded.'); }}
        />

        {active && (
          <div className="md-nowplaying" role="status">
            <button type="button" className="md-play md-play-bar"
                    aria-label={playing ? 'Pause' : 'Play'}
                    onClick={() => toggle(active)}>
              {playing ? '❚❚' : '▶'}
            </button>
            <span className="md-nowplaying-title">{active.title}</span>
            <span className="md-nowplaying-time">
              {Catalog.duration(progress)} / {Catalog.duration(active.duration_s)}
            </span>
          </div>
        )}

        <footer className="md-footer">
          <p>© {new Date().getFullYear()} Big Daddy and Co. · Cleveland, Ohio</p>
          <p><a href="index.html">Back to the band</a></p>
        </footer>
      </React.Fragment>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<MusicPage />);
  </script>
</body>
</html>
