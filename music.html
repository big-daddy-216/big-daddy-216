<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music · Big Daddy and Co.</title>

  <!-- =======================================================================
       THE MUSIC PAGE

       To put a song up, you edit ONE file: assets/data/catalog.js. Upload
       the mp3 to the R2 bucket, then add a block there with the key it
       landed under. Nothing in this file needs touching.

       Full instructions: EDITING.md, "Putting music and videos up".
       ======================================================================= -->

  <!-- Brand kit: icons, PWA manifest, social cards -->
  <link rel="icon" href="assets/brand/big-daddy-favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/brand/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/brand/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <link rel="manifest" href="assets/brand/site.webmanifest">
  <meta name="theme-color" content="#0B0E16">
  <meta name="description" content="Every Big Daddy and Co. recording, in one place. Play it here, or take a loop over to the jam page and build on it.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Music — Big Daddy and Co.">
  <meta property="og:description" content="Every Big Daddy and Co. recording, in one place.">
  <meta property="og:url" content="https://bigdaddyand.co/music.html">
  <meta property="og:image" content="https://bigdaddyand.co/assets/brand/big-daddy-og-banner.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://bigdaddyand.co/assets/brand/big-daddy-og-banner.png">

  <!-- Styles: design system, page overrides, then this page's own bits -->
  <link rel="stylesheet" href="assets/css/site.css">
  <link rel="stylesheet" href="assets/css/enhance.css">
  <link rel="stylesheet" href="assets/css/media.css">
</head>
<body>
  <div id="root"></div>

  <!-- Libraries (vendored locally so the site works offline / from file://) -->
  <script src="assets/js/react.production.min.js"></script>
  <script src="assets/js/react-dom.production.min.js"></script>
  <script src="assets/js/babel.min.js"></script>

  <!-- Reusable design-system components (Button, Card, Stamp, …) -->
  <script src="assets/js/design-system.js"></script>

  <!-- The top bar, shared with every other page. -->
  <script src="assets/js/site-nav.js"></script>

  <!-- The library itself, and the helper that resolves bucket keys. -->
  <script src="assets/data/catalog.js"></script>
  <script src="assets/js/catalog.js"></script>

  <script type="text/babel">
  /* Big Daddy and Co. — the music page.

     One <audio> element for the whole page, held in a ref. Giving every
     track its own would mean two songs playing over each other the moment
     somebody clicks a second one. */

  const { Button, Stamp, SectionHeading, Card } = window.NashSMomDesignSystem_77335a;
  const SiteNav = window.BDNav.Nav;
  const Catalog = window.BDCatalog;

  /* ---- one row in the list --------------------------------------- */
  function Track({ track, active, playing, progress, onToggle, onSeek }) {
    const pct = active && track.duration_s ? (progress / track.duration_s) * 100 : 0;

    return (
      <li className={'md-track' + (active ? ' is-active' : '')}>
        <button type="button" className="md-play"
                aria-label={(playing ? 'Pause ' : 'Play ') + track.title}
                onClick={onToggle}>
          {playing ? '❚❚' : '▶'}
        </button>

        <div className="md-track-body">
          <p className="md-track-title">{track.title}</p>
          <p className="md-track-meta">
            {[track.album, track.year].filter(Boolean).join(' · ')}
          </p>
          {track.blurb && <p className="md-track-blurb">{track.blurb}</p>}

          {/* A scrubber, but only for the track actually playing — an
              inert bar under every row would just be decoration. */}
          {active ? (
            <input className="md-scrub" type="range" min="0" step="0.1"
                   max={track.duration_s || 0}
                   value={Math.min(progress, track.duration_s || 0)}
                   aria-label={'Seek within ' + track.title}
                   onChange={(ev) => onSeek(Number(ev.target.value))} />
          ) : (
            <div className="md-bar" aria-hidden="true"><span style={{ width: pct + '%' }} /></div>
          )}
        </div>

        <span className="md-track-time">
          {active ? Catalog.duration(progress) + ' / ' : ''}{Catalog.duration(track.duration_s)}
        </span>
      </li>
    );
  }

  function MusicPage() {
    const [tracks, setTracks] = React.useState(null);   // null = still loading
    const [activeSlug, setActiveSlug] = React.useState(null);
    const [playing, setPlaying] = React.useState(false);
    const [progress, setProgress] = React.useState(0);
    const [error, setError] = React.useState(null);
    const audioRef = React.useRef(null);

    React.useEffect(() => { Catalog.load('tracks').then(setTracks); }, []);

    const active = tracks && tracks.filter((t) => t.slug === activeSlug)[0];

    /* Album art is the page's only real image weight, so the list is
       grouped by record rather than repeating the cover on every row. */
    const groups = React.useMemo(() => {
      if (!tracks) return [];
      const order = [];
      const byAlbum = {};
      tracks.forEach((t) => {
        const key = t.album || 'Singles';
        if (!byAlbum[key]) { byAlbum[key] = { name: key, cover: t.cover, year: t.year, tracks: [] }; order.push(key); }
        byAlbum[key].tracks.push(t);
      });
      return order.map((k) => byAlbum[k]);
    }, [tracks]);

    function toggle(track) {
      const audio = audioRef.current;
      if (!audio) return;

      if (activeSlug === track.slug) {
        if (audio.paused) { audio.play().catch(() => setError('That track would not start.')); }
        else audio.pause();
        return;
      }

      setError(null);
      setActiveSlug(track.slug);
      setProgress(0);
      audio.src = track.src;
      audio.play().catch(() => setError('That track would not start. It may still be uploading.'));
    }

    function seek(seconds) {
      const audio = audioRef.current;
      if (audio) { audio.currentTime = seconds; setProgress(seconds); }
    }

    return (
      <React.Fragment>
        <SiteNav current="music" cta={{ label: 'Book Us', href: 'index.html#book' }} />

        <main className="md-page">
          <header className="md-hero">
            <Stamp>The Records</Stamp>
            <h1 className="md-hero-title">Music</h1>
            <p className="md-hero-blurb">
              Everything we've put down. Play it here, then go{' '}
              <a href="jam.html">build something on the jam page</a> — the wall over
              there is where the half-finished ideas live.
            </p>
          </header>

          {tracks === null && <p className="md-empty">Fetching the records…</p>}

          {tracks && !tracks.length && (
            <Card>
              <p className="md-empty">
                Nothing up here yet. When there is, it'll be right on this page —
                and in the meantime the <a href="videos.html">videos</a> and the{' '}
                <a href="jam.html">jam board</a> are worth a look.
              </p>
            </Card>
          )}

          {error && <p className="md-error" role="alert">{error}</p>}

          {groups.map((group) => (
            <section key={group.name} className="md-album">
              <div className="md-album-art">
                {group.cover
                  ? <img src={group.cover} alt={'Cover of ' + group.name} loading="lazy" />
                  : <div className="md-album-blank" aria-hidden="true">{group.name}</div>}
              </div>
              <div className="md-album-body">
                <h2 className="md-album-title">{group.name}</h2>
                {group.year && <p className="md-album-year">{group.year}</p>}
                <ul className="md-tracks">
                  {group.tracks.map((track) => (
                    <Track
                      key={track.slug}
                      track={track}
                      active={activeSlug === track.slug}
                      playing={activeSlug === track.slug && playing}
                      progress={activeSlug === track.slug ? progress : 0}
                      onToggle={() => toggle(track)}
                      onSeek={seek}
                    />
                  ))}
                </ul>
              </div>
            </section>
          ))}
        </main>

        {/* One player for the page. preload="none" so opening the page
            doesn't start pulling audio nobody asked for. */}
        <audio
          ref={audioRef}
          preload="none"
          onPlay={() => setPlaying(true)}
          onPause={() => setPlaying(false)}
          onEnded={() => { setPlaying(false); setProgress(0); }}
          onTimeUpdate={(ev) => setProgress(ev.target.currentTime)}
          onError={() => { if (activeSlug) setError('That track could not be loaded.'); }}
        />

        {active && (
          <div className="md-nowplaying" role="status">
            <button type="button" className="md-play md-play-bar"
                    aria-label={playing ? 'Pause' : 'Play'}
                    onClick={() => toggle(active)}>
              {playing ? '❚❚' : '▶'}
            </button>
            <span className="md-nowplaying-title">{active.title}</span>
            <span className="md-nowplaying-time">
              {Catalog.duration(progress)} / {Catalog.duration(active.duration_s)}
            </span>
          </div>
        )}

        <footer className="md-footer">
          <p>© {new Date().getFullYear()} Big Daddy and Co. · Cleveland, Ohio</p>
          <p><a href="index.html">Back to the band</a></p>
        </footer>
      </React.Fragment>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<MusicPage />);
  </script>
</body>
</html>
