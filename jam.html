  <!-- =======================================================================
       WHERE THE LOOPS GET SENT

       Submissions go to Formspree, on the same form the Tevis Engineering
       Solutions site uses. Two consequences worth remembering:

       • Formspree's free tier allows 50 submissions a month across the
         WHOLE ACCOUNT, not per form. Loops from this page draw on the
         same allowance as the TES contact and ticket forms, so a busy
         month here eats into that.
       • The TES back-end reads those notification emails and files them
         as CRM leads. Every submission from this page carries the marker
         below so it gets skipped instead of becoming a fake lead — see
         `_Reference/FORM_SUBMISSION_WORKFLOW_README.md` in TES_Back-End.
         If you change the marker, change it there too.

       To point this somewhere else later, swap `formEndpoint` for another
       Formspree form ("https://formspree.io/f/xxxxxxxx"). The endpoint is
       public by design — it only ever lets someone send mail TO you.
       ======================================================================== -->
  <script>
    window.BD_JAM = {
      formEndpoint: "https://formspree.io/f/maqvanal",

      // Stamped on every submission so the TES back-end can tell band
      // loops apart from real business enquiries and leave them alone.
      sourceTag: "BIG-DADDY-JAM",

      // Where the "listen to this loop" link in your email should point.
      // Kept as a real address rather than read from the browser, so a
      // loop recorded on a test server still emails you a working link.
      siteUrl: "https://bigdaddyand.co/jam.html",

      // The subject line on the emails you receive.
      subject: "Big Daddy jam submission (not a TES lead)"
    };
  </script>

  <!-- ===================================================================
       EDITABLE PAGE CONTENT
       The words on this page live in the JSX below. Edit the text inside
       the quotes, save, reload. Each section is labelled with a comment.
       =================================================================== -->
  <script type="text/babel">
  /* Big Daddy and Co. — "Join the Company" jam page.
     Uses the shared design-system primitives, same as index.html. */

  const { Wordmark, Button, Stamp, SectionHeading, Card, Field } =
    window.NashSMomDesignSystem_77335a;

  const E = window.BDJam;                 // the sound + MIDI engine
  const CONFIG = window.BD_JAM || {};
  const STEPS = E.STEPS;
  const ALL_STEPS = Array.from({ length: STEPS }, (_, i) => i);

  /* Is the Web3Forms key actually filled in? Until it is, the page has
     to say so rather than fake a successful send. */
  const FORM_READY = !!CONFIG.formEndpoint && /^https:\/\/formspree\.io\/f\/\w+$/.test(CONFIG.formEndpoint);

  /* -----------------------------------------------------------------
     COMPUTER-KEYBOARD LAYOUT
     -----------------------------------------------------------------
     Every one of the 25 keys on screen is playable without moving your
     hands, by treating the computer keyboard as two little pianos
     stacked on top of each other:

       upper octave   q 2 w 3 e r 5 t 6 y 7 u i
       lower octave   z s x d c v g b h n j m , l . ; /

     In each pair, the flat row is the white notes and the row above it
     holds their sharps — sitting where the black keys would be. This is
     the layout trackers and DAWs have used for decades, and it happens
     to fit exactly: seventeen slots on the bottom, thirteen up top, and
     no key on screen left stranded.

     The two rows deliberately overlap in the middle (the bottom row runs
     five notes into the upper octave), which is what lets you play
     across the join without jumping rows. */
  const LOWER_ROW_KEYS = ['z', 's', 'x', 'd', 'c', 'v', 'g', 'b', 'h', 'n', 'j', 'm', ',', 'l', '.', ';', '/'];
  const UPPER_ROW_KEYS = ['q', '2', 'w', '3', 'e', 'r', '5', 't', '6', 'y', '7', 'u', 'i'];

  const KEY_MAP = {};
  LOWER_ROW_KEYS.forEach((k, i) => { KEY_MAP[k] = i; });          // semitones 0–16
  UPPER_ROW_KEYS.forEach((k, i) => { KEY_MAP[k] = i + 12; });     // semitones 12–24

  /* What to print on each key. Where both rows reach a note, the upper
     row wins the label, so the second octave on screen reads as the
     top row of the computer keyboard. The lower-row key still works. */
  const HINT_FOR_SEMI = {};
  LOWER_ROW_KEYS.forEach((k, i) => { HINT_FOR_SEMI[i] = k; });
  UPPER_ROW_KEYS.forEach((k, i) => { HINT_FOR_SEMI[i + 12] = k; });

  const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  const WHITE_SEMIS = [0, 2, 4, 5, 7, 9, 11];
  const BLACK_AFTER = [0, 1, 3, 4, 5];   // which white key each black sits after

  function noteLabel(midi) {
    return NOTE_NAMES[midi % 12] + (Math.floor(midi / 12) - 1);
  }

  /* The keyboard is built as two octave-sized groups rather than one
     long run of keys. Side by side on a wide screen they read as a
     single continuous keyboard; on a phone they stack instead, which
     doubles the width of every key and makes them big enough to hit
     with a thumb. Same notes either way.

     The lower group is a plain octave (seven white keys); the upper one
     carries the extra C that closes the keyboard off (eight). */
  function buildOctaveGroup(baseMidi, startSemi, whiteCount) {
    const whites = [];
    for (let i = 0; i < whiteCount; i++) {
      const semi = startSemi + (i < WHITE_SEMIS.length ? WHITE_SEMIS[i] : 12);
      whites.push({ semi, midi: baseMidi + semi });
    }
    const blacks = BLACK_AFTER.map((wi) => {
      const semi = startSemi + WHITE_SEMIS[wi] + 1;
      return { semi, midi: baseMidi + semi, afterWhite: wi };
    });
    return { whites, blacks, whiteCount };
  }

  function buildKeyboard(baseMidi) {
    return [
      buildOctaveGroup(baseMidi, 0, 7),
      buildOctaveGroup(baseMidi, 12, 8)
    ];
  }

  /* Read a loop out of the address bar, if someone followed a link.
     The part after the # is never sent to any server — it only ever
     travels in the email — so a loop stays between the sender and the
     band. */
  function readLoopFromUrl() {
    const m = /(?:^|[#&])loop=([A-Za-z0-9_\-]+)/.exec(window.location.hash || '');
    if (!m) return { pattern: E.emptyPattern(), source: 'new' };
    const decoded = E.decodeLoop(m[1]);
    return decoded
      ? { pattern: decoded, source: 'link' }
      : { pattern: E.emptyPattern(), source: 'broken' };
  }

  /* =================================================================
     NAV — links point back to the homepage's sections.
     ================================================================= */
  function JamNav() {
    const [solid, setSolid] = React.useState(false);
    React.useEffect(() => {
      const onScroll = () => setSolid(window.scrollY > 40);
      window.addEventListener('scroll', onScroll);
      return () => window.removeEventListener('scroll', onScroll);
    }, []);

    const links = [
      ['Shows', 'index.html#shows'],
      ['The Band', 'index.html#theband'],
      ['Records', 'index.html#records'],
      ['Book Us', 'index.html#book']
    ];

    return (
      <header className="jam-header" style={{
        position: 'sticky', top: 0, zIndex: 50,
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '14px clamp(20px,5vw,64px)',
        background: solid ? 'rgba(7,9,15,0.86)' : 'transparent',
        backdropFilter: solid ? 'blur(10px) saturate(1.2)' : 'none',
        borderBottom: solid ? '1px solid var(--border-hairline)' : '1px solid transparent',
        transition: 'all var(--dur-med) var(--ease-out)'
      }}>
        <a href="index.html" aria-label="Big Daddy and Co. — home">
          <img src="assets/brand/big-daddy-wordmark.svg" alt="Big Daddy and Co."
               style={{ height: 34, width: 'auto', display: 'block' }} />
        </a>
        <nav style={{ display: 'flex', alignItems: 'center', gap: 28 }}>
          <div style={{ display: 'flex', gap: 26 }} className="nm-navlinks">
            {links.map(([label, href]) => (
              <a key={label} href={href}
                 style={{ fontFamily: 'var(--font-heading)', fontWeight: 500, fontSize: 14,
                          textTransform: 'uppercase', letterSpacing: '.1em', color: 'var(--bone-300)' }}
                 onMouseEnter={(e) => e.target.style.color = 'var(--ember-glow)'}
                 onMouseLeave={(e) => e.target.style.color = 'var(--bone-300)'}>{label}</a>
            ))}
          </div>
          <Button variant="outline" size="sm" as="a" href="index.html">Back to the Band</Button>
        </nav>
      </header>
    );
  }

  /* =================================================================
     INTRO — the job posting.
     ================================================================= */
  function JamIntro({ source }) {
    return (
      <section className="nm-grain" style={{ position: 'relative', padding: 'var(--section-y) 0 var(--sp-7)' }}>
        <div className="nm-container" style={{ position: 'relative', zIndex: 2 }}>
          <SectionHeading kicker="Careers · Now Hiring" title={<span>Jam<br/>With Us!</span>} glow />
          <p style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--fs-lead)',
                      color: 'var(--bone-300)', marginTop: 22, maxWidth: 640, lineHeight: 1.5 }}>
            <strong style={{ color: 'var(--bone-100)' }}>Big Daddy and Co. is growing.</strong>{' '}
            We're a Cleveland jam band with four guys, one shed, and no HR department to speak of,
            and we are actively seeking talent for jams, gigs, and whatever it is we're doing on a
            Tuesday. This role is fully remote — the studio is on this page.
          </p>
          <p style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--fs-lead)',
                      color: 'var(--bone-300)', marginTop: 16, maxWidth: 640, lineHeight: 1.5 }}>
            Program a beat, play something over it, give it your absolute best, and submit it below
            for review. We read every application. We are, admittedly, easily impressed.
          </p>
          <div style={{ display: 'flex', gap: 10, marginTop: 26, flexWrap: 'wrap' }}>
            <Stamp tone="ember" rotate={-2}>Fully remote</Stamp>
            <Stamp tone="bone">216 born &amp; raised</Stamp>
            <Stamp tone="volt">Rolling applications</Stamp>
            <Stamp tone="bone" rotate={1}>No experience necessary</Stamp>
          </div>

          {source === 'link' && (
            <div className="jam-status" data-tone="ok" style={{ marginTop: 26, maxWidth: 640 }}>
              <strong>Application under review.</strong> This loop arrived from a link — hit play
              to hear it exactly as it was submitted, or grab the .mid and drop it into a session.
              Please evaluate the candidate fairly and with an open heart.
            </div>
          )}
          {source === 'broken' && (
            <div className="jam-status" data-tone="warn" style={{ marginTop: 26, maxWidth: 640 }}>
              <strong>This application appears to be damaged in transit.</strong> The code in the
              address bar didn't decode, so we've started you with a blank grid. Ask whoever sent
              it for the whole link — they're easy to cut short.
            </div>
          )}
        </div>
      </section>
    );
  }

  /* =================================================================
     TRANSPORT — play, record, metronome, tempo.
     (Voice lives on each layer now, not up here.)
     ================================================================= */
  function Transport(props) {
    return (
      <div className="jam-transport">
        <div className="jam-transport-group">
          <Button variant={props.playing ? 'flag' : 'primary'} size="md" onClick={props.onPlay}>
            {props.playing ? 'Stop' : 'Play'}
          </Button>
          <Button variant={props.recording ? 'flag' : 'outline'} size="md"
                  onClick={props.onRecord}
                  className={props.recording ? 'jam-rec-armed' : ''}
                  aria-pressed={props.recording}>
            {props.recording ? '● Recording' : '● Record'}
          </Button>
          <Button variant={props.metronome ? 'primary' : 'ghost'} size="sm"
                  onClick={props.onMetronome} aria-pressed={props.metronome}>
            Click
          </Button>
        </div>

        <div className="jam-tempo">
          <span className="jam-tempo-unit">Tempo</span>
          <input type="range" min={E.BPM_MIN} max={E.BPM_MAX} value={props.bpm}
                 aria-label="Tempo in beats per minute"
                 onChange={(e) => props.onBpm(Number(e.target.value))} />
          <span className="jam-tempo-readout">{props.bpm}</span>
          <span className="jam-tempo-unit">BPM</span>
        </div>

        <div className="jam-transport-group">
          <span className="jam-tempo-unit">
            {props.recording
              ? 'Recording into ' + props.layerName
              : 'Playing ' + props.layerName}
          </span>
        </div>
      </div>
    );
  }

  /* =================================================================
     LAYERS — four independent keyboard tracks.

     The selected layer is the one the keyboard plays and the one new
     notes record into. Everything else keeps looping while you play,
     which is the whole point: lay something down, hear it come round,
     riff over the top of it.
     ================================================================= */
  function LayerStrip({ layers, selected, onSelect, onVoice, onMute, onSolo, onClear }) {
    const anySolo = layers.some((l) => l.solo);
    return (
      <div className="jam-layers">
        {layers.map((layer, i) => {
          const silenced = anySolo ? !layer.solo : layer.muted;
          return (
            <div key={i}
                 className="jam-layer"
                 data-selected={selected === i}
                 data-silent={silenced}
                 onClick={() => onSelect(i)}>
              <div className="jam-layer-head">
                <span className="jam-layer-name">Layer {i + 1}</span>
                <span className="jam-layer-count">
                  {layer.notes.length || '—'}
                </span>
              </div>

              <select className="jam-select" value={layer.voice}
                      aria-label={'Voice for layer ' + (i + 1)}
                      onClick={(e) => e.stopPropagation()}
                      onChange={(e) => onVoice(i, e.target.value)}>
                {E.VOICES.map((v) => (
                  <option key={v.id} value={v.id}>{v.label}</option>
                ))}
              </select>

              <div className="jam-layer-btns">
                <button type="button" className="jam-mini" data-on={layer.muted}
                        aria-pressed={!!layer.muted}
                        title={'Mute layer ' + (i + 1)}
                        onClick={(e) => { e.stopPropagation(); onMute(i); }}>Mute</button>
                <button type="button" className="jam-mini" data-on={layer.solo}
                        aria-pressed={!!layer.solo}
                        title={'Solo layer ' + (i + 1)}
                        onClick={(e) => { e.stopPropagation(); onSolo(i); }}>Solo</button>
                <button type="button" className="jam-mini"
                        title={'Clear layer ' + (i + 1)}
                        onClick={(e) => { e.stopPropagation(); onClear(i); }}>Clear</button>
              </div>
            </div>
          );
        })}
      </div>
    );
  }

  /* =================================================================
     ARRANGE — copy, paste, and the one-click "make the back half match
     the front half", which is most of what anyone actually wants.
     ================================================================= */
  const BEATS = E.STEPS / E.STEPS_PER_BEAT;          // 8

  const COPY_RANGES = [
    { label: 'Beats 1–2', from: 0,  len: 8  },
    { label: 'Beats 3–4', from: 8,  len: 8  },
    { label: 'Beats 5–6', from: 16, len: 8  },
    { label: 'Beats 7–8', from: 24, len: 8  },
    { label: 'Beats 1–4', from: 0,  len: 16 },
    { label: 'Beats 5–8', from: 16, len: 16 }
  ];

  const SCOPES = [
    { value: 'all',   label: 'Everything' },
    { value: 'drums', label: 'Drums only' },
    { value: 'keys',  label: 'Keys only' }
  ];

  function ArrangeBar(props) {
    return (
      <div className="jam-arrange">
        <Button size="sm" variant="outline" onClick={props.onDouble}>Double It</Button>
        <span className="jam-arrange-hint">makes beats 5–8 match beats 1–4</span>

        <span className="jam-arrange-sep" aria-hidden="true" />

        <label className="jam-inline-label">
          Copy
          <select className="jam-select" value={props.rangeIndex}
                  onChange={(e) => props.onRange(Number(e.target.value))}>
            {COPY_RANGES.map((r, i) => <option key={r.label} value={i}>{r.label}</option>)}
          </select>
        </label>

        <label className="jam-inline-label">
          of
          <select className="jam-select" value={props.scope}
                  onChange={(e) => props.onScope(e.target.value)}>
            {SCOPES.map((sc) => <option key={sc.value} value={sc.value}>{sc.label}</option>)}
          </select>
        </label>

        <Button size="sm" variant="ghost" onClick={props.onCopy}>Copy</Button>

        <label className="jam-inline-label">
          Paste at beat
          <select className="jam-select" value={props.pasteBeat}
                  onChange={(e) => props.onPasteBeat(Number(e.target.value))}>
            {Array.from({ length: BEATS }, (_, i) => (
              <option key={i} value={i}>{i + 1}</option>
            ))}
          </select>
        </label>

        <Button size="sm" variant={props.hasClip ? 'primary' : 'ghost'}
                disabled={!props.hasClip} onClick={props.onPaste}>Paste</Button>

        {props.clipNote && <span className="jam-arrange-hint">{props.clipNote}</span>}
      </div>
    );
  }

  /* =================================================================
     SAMPLE PAD — record something with the microphone.

     The mic is only opened when this button is pressed, and the
     recording never leaves the visitor's machine: it isn't in the loop
     link and it can't be in the .mid, because a MIDI file stores notes
     rather than sound. The page says so rather than letting anyone
     assume otherwise.
     ================================================================= */
  const MIC_MESSAGES = {
    denied: "Your browser blocked the microphone. If you want to try again, allow mic access for this site in the address bar and hit record.",
    'no-device': "No microphone turned up. Plug one in, or check nothing else has taken it over.",
    insecure: "Browsers only hand over the microphone on a secure connection, and this page isn't on one.",
    unsupported: "This browser won't let a web page record audio. Chrome, Firefox or a recent Safari will.",
    'decode-failed': "The recording came back in a format we couldn't read. Worth another go.",
    empty: "That came back silent — nothing was captured."
  };

  function SamplePad({ state, onRecord, onStop, onPlay, onClear, pitched, onPitched }) {
    return (
      <div className="jam-sample">
        <div className="jam-sample-main">
          {state.recording ? (
            <Button size="sm" variant="flag" className="jam-rec-armed" onClick={onStop}>
              ■ Stop ({state.countdown}s)
            </Button>
          ) : (
            <Button size="sm" variant={state.seconds ? 'ghost' : 'outline'} onClick={onRecord}>
              {state.seconds ? 'Re-record sample' : '● Record a sample'}
            </Button>
          )}

          {state.seconds != null && !state.recording && (
            <React.Fragment>
              <Button size="sm" variant="ghost" onClick={onPlay}>Hear it</Button>
              <Button size="sm" variant="ghost" onClick={onClear}>Clear</Button>
              <span className="jam-tempo-unit">{state.seconds}s captured</span>
              <label className="jam-inline-label jam-check">
                <input type="checkbox" checked={pitched}
                       onChange={(e) => onPitched(e.target.checked)} />
                Play it from the keyboard
              </label>
            </React.Fragment>
          )}
        </div>

        <p className="jam-sample-note">
          {state.error
            ? MIC_MESSAGES[state.error] || 'The microphone could not be started.'
            : 'Record up to ' + E.MAX_SAMPLE_SECONDS + ' seconds — a word, a clap, a guitar stab — ' +
              'and lay it into the grid. It stays on your device: audio can\u2019t travel in the loop ' +
              'link or the .mid, so it won\u2019t reach the band.'}
        </p>
      </div>
    );
  }

  /* =================================================================
     THE GRID — drum lanes, the sample lane, and a row per keyboard
     layer showing what's been recorded into it.
     ================================================================= */
  function StepGrid(props) {
    const { pattern, uiStep, onToggle, onAudition, onToggleSample, hasSample,
            layerSteps, selectedLayer, onSelectLayer } = props;

    const cell = (key, opts) => (
      <button key={key} type="button" className="jam-cell"
              data-beat={opts.step % E.STEPS_PER_BEAT === 0}
              data-bar={opts.step % 16 === 0}
              data-playing={uiStep === opts.step}
              aria-pressed={!!opts.on}
              aria-label={opts.label}
              onClick={opts.onClick} />
    );

    return (
      <div className="jam-grid-scroll">
        <div className="jam-grid">
          <div className="jam-row jam-ruler" aria-hidden="true">
            <div />
            {ALL_STEPS.map((s) => (
              <div key={s} className="jam-tick"
                   data-beat={s % E.STEPS_PER_BEAT === 0}
                   data-bar={s % 16 === 0}>
                {s % E.STEPS_PER_BEAT === 0 ? (s / E.STEPS_PER_BEAT) + 1 : '·'}
              </div>
            ))}
          </div>

          {E.LANES.map((lane, li) => (
            <div className="jam-row" key={lane.id}>
              <button type="button" className="jam-lane-label"
                      onClick={() => onAudition(lane.id)}
                      title={'Hear the ' + lane.label}>{lane.label}</button>
              {ALL_STEPS.map((s) => cell(s, {
                step: s,
                on: pattern.drums[li][s],
                label: lane.label + ', step ' + (s + 1),
                onClick: () => onToggle(li, s)
              }))}
            </div>
          ))}

          {hasSample && (
            <div className="jam-row">
              <div className="jam-lane-label jam-lane-sample">Sample</div>
              {ALL_STEPS.map((s) => cell('smp' + s, {
                step: s,
                on: pattern.sample[s],
                label: 'Sample, step ' + (s + 1),
                onClick: () => onToggleSample(s)
              }))}
            </div>
          )}

          {pattern.layers.map((layer, li) => (
            <div className="jam-row" key={'layer' + li}>
              <button type="button"
                      className="jam-lane-label jam-lane-layer"
                      data-selected={selectedLayer === li}
                      onClick={() => onSelectLayer(li)}
                      title={'Play and record into layer ' + (li + 1)}>
                L{li + 1} · {(E.VOICES.find((v) => v.id === layer.voice) || {}).label}
              </button>
              {ALL_STEPS.map((s) => (
                <div key={s} className="jam-cell"
                     data-beat={s % E.STEPS_PER_BEAT === 0}
                     data-bar={s % 16 === 0}
                     data-playing={uiStep === s}
                     data-note={!!layerSteps[li][s]}
                     data-dim={layer.muted}
                     aria-hidden="true" />
              ))}
            </div>
          ))}
        </div>
      </div>
    );
  }

  /* =================================================================
     THE KEYBOARD
     ================================================================= */
  function Keyboard({ baseMidi, down, onPress, onRelease }) {
    const groups = buildKeyboard(baseMidi);

    /* Pointer capture means a finger that slides off a key still sends
       its release to that key, instead of leaving a note ringing. */
    const bind = (midi) => ({
      onPointerDown: (e) => {
        e.preventDefault();
        if (e.currentTarget.setPointerCapture) {
          try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
        }
        onPress(midi);
      },
      onPointerUp: () => onRelease(midi),
      onPointerCancel: () => onRelease(midi),
      onLostPointerCapture: () => onRelease(midi)
    });

    return (
      <div className="jam-keyboard">
        {groups.map((g, gi) => {
          // Black keys are placed as a share of *this group's* width, so
          // the maths holds whether the groups sit side by side or stack.
          const unit = 100 / g.whiteCount;
          const blackWidth = unit * 0.62;
          return (
            <div className="jam-keys" key={gi} style={{ flexGrow: g.whiteCount }}>
              {g.whites.map((k) => (
                <button key={k.semi} type="button" className="jam-key-white"
                        data-down={!!down[k.midi]}
                        aria-label={noteLabel(k.midi)}
                        {...bind(k.midi)}>
                  <span className="jam-key-hint">{HINT_FOR_SEMI[k.semi] || ''}</span>
                </button>
              ))}
              {g.blacks.map((k) => (
                <button key={k.semi} type="button" className="jam-key-black"
                        data-down={!!down[k.midi]}
                        aria-label={noteLabel(k.midi)}
                        style={{
                          left: 'calc(' + ((k.afterWhite + 1) * unit) + '% - ' + (blackWidth / 2) + '%)',
                          width: blackWidth + '%'
                        }}
                        {...bind(k.midi)}>
                  <span className="jam-key-hint">{HINT_FOR_SEMI[k.semi] || ''}</span>
                </button>
              ))}
            </div>
          );
        })}
      </div>
    );
  }

    return (
      <section style={{ padding: '0 0 var(--section-y)' }}>

          <SectionHeading kicker="Step One" title="The Audition" />

          <Card padding="clamp(20px,3vw,36px)">

  const INSTRUMENTS = [

    { value: 'guitar', label: 'Guitar' },
    { value: 'bass', label: 'Bass' },
    { value: 'drums', label: 'Drums' },

  function SendPanel({ pattern, loopCode, loopLink, onDownload }) {
    const [name, setName] = React.useState('');
    const [email, setEmail] = React.useState('');
    const [instrument, setInstrument] = React.useState('keys');
    const [message, setMessage] = React.useState('');
    const [status, setStatus] = React.useState(null);
    const [sending, setSending] = React.useState(false);
    const [sent, setSent] = React.useState(false);
    const [copied, setCopied] = React.useState(false);
    const botRef = React.useRef(null);

    const empty = E.isEmptyPattern(pattern);

    function copyLink() {
      const done = () => {
        setCopied(true);
        window.setTimeout(() => setCopied(false), 2500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(loopLink).then(done, fallbackCopy);
      } else {
        fallbackCopy();
      }
      function fallbackCopy() {
        // Older browsers, and any page not served over https.
        const ta = document.createElement('textarea');
        ta.value = loopLink;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); done(); } catch (e) {
          setStatus({ tone: 'warn', text: 'Copying is blocked here — select the code below and copy it by hand.' });
        }
        document.body.removeChild(ta);
      }
    }

    function submit(e) {
      e.preventDefault();
      setStatus(null);

      if (botRef.current && botRef.current.checked) return;   // a bot filled the honeypot

      if (empty) {
        setStatus({
          tone: 'warn',
          text: "Your application is blank. We admire the confidence, but program a beat or play a few notes first — the audition is the whole interview here."
        });
        return;
      }
      if (!FORM_READY) {
        setStatus({
          tone: 'warn',
          text: "Applications aren't open yet — this page hasn't been pointed at a working form, so nothing would actually reach the band. Your loop is safe though: download the .mid or copy the link below and send it over however you like."
        });
        return;
      }

      // A one-line summary of what's on each layer, so the email says
      // something useful without anyone having to open the link first.
      const layerSummary = pattern.layers
        .map((layer, i) => {
          if (!layer.notes.length) return null;
          const voice = (E.VOICES.find((v) => v.id === layer.voice) || {}).label || layer.voice;
          return 'Layer ' + (i + 1) + ': ' + voice + ' (' + layer.notes.length + ' notes)';
        })
        .filter(Boolean)
        .join(', ') || 'drums only';

      setSending(true);
      fetch(CONFIG.formEndpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({
          // Formspree's own fields all start with an underscore.
          _subject: CONFIG.subject || 'Big Daddy jam submission',
          _replyto: email,

          /* The marker the TES back-end looks for so these don't get
             filed as CRM leads. Keep it in step with the classifier in
             TES_Back-End. */
          form_source: CONFIG.sourceTag || 'BIG-DADDY-JAM',

          // These names are what you'll see as the labels in the email,
          // so they're written the way you'd want to read them.
          name: name,
          email: email,
          position_applying_for: (INSTRUMENTS.find((i) => i.value === instrument) || {}).label || instrument,
          cover_letter: message || '(none supplied)',
          tempo: pattern.bpm + ' BPM',
          layers: layerSummary,
          listen_to_the_loop: loopLink,
          loop_code: loopCode
        })
      })
        /* Formspree answers 200 on success and 4xx with an `errors`
           array on failure, so the status code is what to trust. */
        .then((res) => res.json().then(
          (data) => ({ ok: res.ok, data: data }),
          () => ({ ok: res.ok, data: null })
        ))
        .then((result) => {
          setSending(false);
          if (result.ok) {
            setSent(true);
            setStatus({ tone: 'ok', text: "Submitted. It's in the band's inbox — thanks for playing." });
          } else {
            const errs = result.data && result.data.errors;
            const detail = errs && errs.length
              ? errs.map((e) => e.message).join(', ')
              : (result.data && result.data.error) || '';
            setStatus({
              tone: 'error',
              text: 'The mail service turned that away' + (detail ? ' — ' + detail : '') +
                    '. Not your fault, and your loop is safe: grab the .mid or copy the link below.'
            });
          }
        })
        .catch((err) => {
          setSending(false);
          setStatus({
            tone: 'error',
            text: "Couldn't reach the mail service (" + (err && err.message ? err.message : 'network error') +
                  '). Your loop is safe — download the .mid or copy the link below and send it over another way.'
          });
        });
    }

    return (
      <section id="send" style={{ padding: 'var(--section-y) 0' }}>
        <div className="nm-container jam-stack"
             style={{ display: 'grid', gridTemplateColumns: '1fr 1fr',
                      gap: 'clamp(32px,5vw,80px)', alignItems: 'start' }}>
          <div>
            <SectionHeading kicker="Step Two" title={<span>Submit For<br/>Review</span>} />
            <p style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--fs-lead)',
                        color: 'var(--bone-300)', marginTop: 22, maxWidth: 460, lineHeight: 1.5 }}>
              Your application travels as a link. We click it, your exact loop opens and plays on
              this same page, and we can pull the MIDI straight into a session. Every one gets
              listened to by an actual human being in an actual backwards cap.
            </p>
            <p style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--fs-sm)',
                        color: 'var(--bone-400)', marginTop: 14, maxWidth: 460, lineHeight: 1.55 }}>
              Candidates are considered for one-off jams and paying gigs alike, so say which
              you're after. We are not currently able to relocate anyone, but we have been known
              to swing by and pick people up.
            </p>

            <div className="jam-actions" style={{ marginTop: 28 }}>
              <Button variant="outline" size="md" onClick={onDownload} disabled={empty}>
                Download .mid
              </Button>
              <Button variant="ghost" size="md" onClick={copyLink} disabled={empty}>
                {copied ? 'Link copied!' : 'Copy loop link'}
              </Button>
            </div>

            {!empty && (
              <div style={{ marginTop: 20 }}>
                <div style={{ fontFamily: 'var(--font-stamp)', fontSize: 10, letterSpacing: '.14em',
                              textTransform: 'uppercase', color: 'var(--bone-400)', marginBottom: 8 }}>
                  Your submission code
                </div>
                <div className="jam-code-box">{loopCode}</div>
              </div>
            )}
          </div>

          <Card padding="clamp(24px,3vw,40px)">
            {sent ? (
              <div style={{ textAlign: 'center', padding: '32px 0' }}>
                <div style={{ fontFamily: 'var(--font-display)', fontSize: 44, color: 'var(--ember-glow)',
                              textTransform: 'uppercase', lineHeight: 0.9 }}>Application<br/>Received!</div>
                <p style={{ color: 'var(--bone-300)', marginTop: 16 }}>
                  It's in the pile, and somebody will listen to the whole thing — which is more
                  than most companies can say. If it moves us, you'll hear back. Keep it loud.
                </p>
                <div className="jam-actions" style={{ marginTop: 24, justifyContent: 'center' }}>
                  <Button variant="outline" size="sm" onClick={onDownload}>Download your .mid</Button>
                </div>
              </div>
            ) : (
              <form onSubmit={submit} style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
                  <Field label="Applicant Name" placeholder="Jane Shredder" required
                         value={name} onChange={(e) => setName(e.target.value)} />
                  <Field label="Email" type="email" placeholder="you@wherever.com" required
                         value={email} onChange={(e) => setEmail(e.target.value)} />
                </div>
                <Field label="Position Applying For" type="select" options={INSTRUMENTS}
                       value={instrument} onChange={(e) => setInstrument(e.target.value)} />
                <Field label="Cover Letter" type="textarea" rows={4}
                       hint="Optional. Nobody has ever been turned down for skipping it."
                       placeholder="Where you're from, what you're after, and how you'd hold up in a van for nine hours."
                       value={message} onChange={(e) => setMessage(e.target.value)} />

                {/* Honeypot — invisible to people, irresistible to bots. */}
                {/* Formspree's honeypot is named _gotcha. Invisible to
                    people, irresistible to bots — and a filled one is
                    dropped here rather than sent. */}
                <label className="jam-botcheck" aria-hidden="true">
                  <input type="checkbox" name="_gotcha" ref={botRef} tabIndex={-1} autoComplete="off" />
                </label>

                <Button variant="primary" size="lg" as="button" type="submit"
                        disabled={sending} style={{ width: '100%' }}>
                  {sending ? 'Submitting…' : 'Submit Application'}
                </Button>

                {!FORM_READY && (
                  <p style={{ fontFamily: 'var(--font-stamp)', fontSize: 10, letterSpacing: '.1em',
                              textTransform: 'uppercase', color: 'var(--bone-400)', textAlign: 'center' }}>
                    Applications aren't open yet
                  </p>
                )}
              </form>
            )}

            <div aria-live="polite">
              {status && (
                <div className="jam-status" data-tone={status.tone} style={{ marginTop: 18 }}>
                  {status.text}
                </div>
              )}
            </div>
          </Card>
        </div>
      </section>
    );
  }

  /* =================================================================
     THE PAGE — all the state lives here.
     ================================================================= */
  function JamPage() {
    const [loaded, setLoaded] = React.useState(readLoopFromUrl);
    const [pattern, setPattern] = React.useState(loaded.pattern);
    const [playing, setPlaying] = React.useState(false);
    const [recording, setRecording] = React.useState(false);
    const [metronome, setMetronome] = React.useState(false);
    const [uiStep, setUiStep] = React.useState(-1);
    const [baseMidi, setBaseMidi] = React.useState(60);   // middle C
    const [down, setDown] = React.useState({});
    const [selectedLayer, setSelectedLayer] = React.useState(0);

    // Arranging
    const [clip, setClip] = React.useState(null);
    const [rangeIndex, setRangeIndex] = React.useState(4);   // "Beats 1–4"
    const [pasteBeat, setPasteBeat] = React.useState(4);     // beat 5
    const [scope, setScope] = React.useState('all');

    // The microphone pad
    const [sampleState, setSampleState] = React.useState({
      seconds: null, recording: false, error: null, countdown: 0
    });
    const [sampleKeyboard, setSampleKeyboard] = React.useState(false);

    /* The scheduler runs on a timer, outside React's render cycle. If it
       read state directly it would capture the values from the render
       that started it and never see a tempo change, so it reads refs. */
    const patternRef = React.useRef(pattern);
    patternRef.current = pattern;
    const metronomeRef = React.useRef(metronome);
    metronomeRef.current = metronome;
    const recordingRef = React.useRef(recording);
    recordingRef.current = recording;
    const baseMidiRef = React.useRef(baseMidi);
    baseMidiRef.current = baseMidi;
    const selectedRef = React.useRef(selectedLayer);
    selectedRef.current = selectedLayer;
    const sampleKbdRef = React.useRef(sampleKeyboard);
    sampleKbdRef.current = sampleKeyboard;

    const heldRef = React.useRef({});      // midi -> live note handle
    const kbdRef = React.useRef({});       // computer key -> the midi it started

    const transportState = React.useCallback(() => ({
      pattern: patternRef.current,
      bpm: patternRef.current.bpm,
      metronome: metronomeRef.current
    }), []);

    /* --- transport ------------------------------------------------- */
    const togglePlay = React.useCallback(() => {
      if (E.isPlaying()) {
        E.stop();
        setPlaying(false);
        setRecording(false);
      } else {
        // Called straight from a click, which is what lets audio start.
        E.start(transportState);
        setPlaying(true);
      }
    }, [transportState]);

    const toggleRecord = React.useCallback(() => {
      setRecording((r) => {
        const next = !r;
        // Arming record with the transport stopped is a dead end, so
        // start it rolling too.
        if (next && !E.isPlaying()) {
          E.start(transportState);
          setPlaying(true);
        }
        return next;
      });
    }, [transportState]);

    /* --- playhead --------------------------------------------------
       Driven off the audio clock, and only calls setState when the step
       actually changes — thirty-two times a bar pair, not sixty times a
       second. */
    React.useEffect(() => {
      if (!playing) { setUiStep(-1); return undefined; }
      let raf = 0, alive = true, drawn = -1;
      const tick = () => {
        if (!alive) return;
        const s = E.currentPlayStep();
        if (s !== drawn) { drawn = s; setUiStep(s); }
        raf = window.requestAnimationFrame(tick);
      };
      raf = window.requestAnimationFrame(tick);
      return () => { alive = false; window.cancelAnimationFrame(raf); };
    }, [playing]);

    // Stop the transport if the page goes away mid-loop.
    React.useEffect(() => () => E.stop(), []);

    /* Following a loop link while this page is already open only changes
       the part after the # — the browser doesn't reload, so without this
       the new loop would be silently ignored. */
    React.useEffect(() => {
      const onHash = () => {
        const next = readLoopFromUrl();
        if (next.source === 'new') return;      // hash cleared, nothing to load
        setLoaded(next);
        // A link that won't decode is worth saying so about, but it is
        // not worth throwing away whatever the visitor already built.
        if (next.source !== 'link') return;
        E.stop();
        setPlaying(false);
        setRecording(false);
        setPattern(next.pattern);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
      window.addEventListener('hashchange', onHash);
      return () => window.removeEventListener('hashchange', onHash);
    }, []);

    /* --- editing the pattern --------------------------------------- */
    const toggleCell = React.useCallback((lane, step) => {
      E.ensureAudio();
      const turningOn = !patternRef.current.drums[lane][step];

      /* Preview the hit only while the transport is stopped. Once it's
         rolling, the sequencer is already playing the pattern, and an
         extra hit fired off-grid the instant you tap a cell muddies
         what you're trying to listen to. */
      if (turningOn && !E.isPlaying()) E.playDrum(E.LANES[lane].id);

      setPattern((p) => Object.assign({}, p, {
        drums: p.drums.map((row, i) =>
          i === lane ? row.map((on, s) => (s === step ? !on : on)) : row)
      }));
    }, []);

    const toggleSampleCell = React.useCallback((step) => {
      E.ensureAudio();
      const turningOn = !patternRef.current.sample[step];
      if (turningOn && !E.isPlaying()) E.playSample();
      setPattern((p) => Object.assign({}, p, {
        sample: p.sample.map((on, s) => (s === step ? !on : on))
      }));
    }, []);

    const audition = React.useCallback((laneId) => {
      E.ensureAudio();
      E.playDrum(laneId);
    }, []);

    const addNote = React.useCallback((layerIndex, note) => {
      setPattern((p) => Object.assign({}, p, {
        layers: p.layers.map((layer, i) => {
          if (i !== layerIndex) return layer;
          if (layer.notes.length >= E.MAX_NOTES) return layer;
          // Replace rather than stack when the same pitch is played on
          // the same step twice, so overdubbing doesn't pile up copies.
          const kept = layer.notes.filter(
            (n) => !(n.step === note.step && n.midi === note.midi));
          return Object.assign({}, layer, { notes: kept.concat([note]) });
        })
      }));
    }, []);

    /* --- layers ----------------------------------------------------- */
    const updateLayer = React.useCallback((index, changes) => {
      setPattern((p) => Object.assign({}, p, {
        layers: p.layers.map((layer, i) =>
          i === index ? Object.assign({}, layer, changes) : layer)
      }));
    }, []);

    const setLayerVoice = React.useCallback((i, voice) => {
      updateLayer(i, { voice });
      setSelectedLayer(i);
    }, [updateLayer]);

    const toggleMute = React.useCallback((i) => {
      setPattern((p) => Object.assign({}, p, {
        layers: p.layers.map((layer, j) =>
          j === i ? Object.assign({}, layer, { muted: !layer.muted }) : layer)
      }));
    }, []);

    const toggleSolo = React.useCallback((i) => {
      setPattern((p) => Object.assign({}, p, {
        layers: p.layers.map((layer, j) =>
          j === i ? Object.assign({}, layer, { solo: !layer.solo }) : layer)
      }));
    }, []);

    const clearLayer = React.useCallback((i) => updateLayer(i, { notes: [] }), [updateLayer]);

    /* --- playing notes --------------------------------------------- */
    const pressNote = React.useCallback((midi) => {
      if (heldRef.current[midi]) return;             // already down

      /* With the sample pad switched over to the keyboard, the keys fire
         the recording pitched up and down instead of a synth voice. It's
         a one-shot, so there's nothing to release. */
      if (sampleKbdRef.current && E.hasSample()) {
        E.playSample(null, midi);
        setDown((d) => Object.assign({}, d, { [midi]: true }));
        window.setTimeout(() => setDown((d) => {
          const next = Object.assign({}, d);
          delete next[midi];
          return next;
        }), 140);
        return;
      }

      const layerIndex = selectedRef.current;
      const layer = patternRef.current.layers[layerIndex];
      const handle = E.noteOn(layer.voice, midi, 100);
      heldRef.current[midi] = {
        handle: handle,
        layer: layerIndex,
        step: E.isPlaying() ? E.liveStep() : null,
        at: E.now()
      };
      setDown((d) => Object.assign({}, d, { [midi]: true }));
    }, []);

    const releaseNote = React.useCallback((midi) => {
      const held = heldRef.current[midi];
      if (!held) return;
      delete heldRef.current[midi];
      E.noteOff(held.handle);
      setDown((d) => {
        const next = Object.assign({}, d);
        delete next[midi];
        return next;
      });

      if (recordingRef.current && held.step !== null) {
        const stepDur = E.stepDuration(patternRef.current.bpm);
        const heldFor = Math.max(E.now() - held.at, 0);
        const len = Math.min(Math.max(Math.round(heldFor / stepDur), 1), STEPS);
        addNote(held.layer, { step: held.step, midi: midi, len: len, velocity: 100 });
      }
    }, [addNote]);

    /* --- computer keyboard ------------------------------------------
       Handlers live in refs so the listeners bind once and never go
       stale. Which midi note a key started is remembered, so changing
       octave mid-press can't strand a note ringing. */
    const fns = React.useRef({});
    fns.current = { togglePlay, pressNote, releaseNote };

    React.useEffect(() => {
      const inField = (el) => !!el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName);

      const onDown = (e) => {
        if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
        if (inField(e.target)) return;

        if (e.code === 'Space') { e.preventDefault(); fns.current.togglePlay(); return; }
        if (e.key === 'ArrowLeft')  { e.preventDefault(); setBaseMidi((m) => Math.max(24, m - 12)); return; }
        if (e.key === 'ArrowRight') { e.preventDefault(); setBaseMidi((m) => Math.min(84, m + 12)); return; }

        const k = e.key.toLowerCase();
        if (!(k in KEY_MAP) || kbdRef.current[k] != null) return;
        e.preventDefault();
        const midi = baseMidiRef.current + KEY_MAP[k];
        kbdRef.current[k] = midi;
        fns.current.pressNote(midi);
      };

      const onUp = (e) => {
        const k = e.key.toLowerCase();
        const midi = kbdRef.current[k];
        if (midi == null) return;
        delete kbdRef.current[k];
        fns.current.releaseNote(midi);
      };

      // Leaving the window swallows the keyup, which would leave notes
      // ringing until the engine's own safety net cuts them off.
      const onBlur = () => {
        Object.keys(kbdRef.current).forEach((k) => {
          const midi = kbdRef.current[k];
          delete kbdRef.current[k];
          fns.current.releaseNote(midi);
        });
      };

      window.addEventListener('keydown', onDown);
      window.addEventListener('keyup', onUp);
      window.addEventListener('blur', onBlur);
      return () => {
        window.removeEventListener('keydown', onDown);
        window.removeEventListener('keyup', onUp);
        window.removeEventListener('blur', onBlur);
      };
    }, []);

    /* --- arranging --------------------------------------------------- */
    const doCopy = React.useCallback(() => {
      const r = COPY_RANGES[rangeIndex];
      setClip(Object.assign(E.copyRange(patternRef.current, r.from, r.len, scope), {
        label: r.label, scopeLabel: (SCOPES.find((sc) => sc.value === scope) || {}).label
      }));
    }, [rangeIndex, scope]);

    const doPaste = React.useCallback(() => {
      if (!clip) return;
      setPattern((p) => E.pasteRange(p, clip, pasteBeat * E.STEPS_PER_BEAT));
    }, [clip, pasteBeat]);

    const doDouble = React.useCallback(() => {
      setPattern((p) => E.duplicateFirstHalf(p));
    }, []);

    /* --- the microphone ---------------------------------------------- */
    const countdownRef = React.useRef(null);

    const stopCountdown = () => {
      if (countdownRef.current) {
        window.clearInterval(countdownRef.current);
        countdownRef.current = null;
      }
    };

    const startSample = React.useCallback(() => {
      E.ensureAudio();
      setSampleState((s) => Object.assign({}, s, {
        error: null, recording: true, countdown: E.MAX_SAMPLE_SECONDS
      }));

      stopCountdown();
      countdownRef.current = window.setInterval(() => {
        setSampleState((s) => Object.assign({}, s, {
          countdown: Math.max(0, s.countdown - 1)
        }));
      }, 1000);

      E.recordSample(E.MAX_SAMPLE_SECONDS).then((info) => {
        stopCountdown();
        setSampleState({ seconds: info.seconds, recording: false, error: null, countdown: 0 });
      }, (err) => {
        stopCountdown();
        setSampleState({
          seconds: E.hasSample() ? (E.sampleInfo() || {}).seconds : null,
          recording: false,
          error: (err && err.message) || 'unsupported',
          countdown: 0
        });
      });
    }, []);

    const stopSample = React.useCallback(() => E.stopSampleRecording(), []);

    const clearSample = React.useCallback(() => {
      E.clearSample();
      setSampleKeyboard(false);
      setSampleState({ seconds: null, recording: false, error: null, countdown: 0 });
      // The lane is meaningless without the audio behind it.
      setPattern((p) => Object.assign({}, p, { sample: p.sample.map(() => false) }));
    }, []);

    React.useEffect(() => stopCountdown, []);

    /* --- sharing ---------------------------------------------------- */
    const loopCode = E.encodeLoop(pattern);
    const base = (CONFIG.siteUrl || 'https://bigdaddyand.co/jam.html').replace(/#.*$/, '');
    const loopLink = base + '#loop=' + loopCode;

    const download = React.useCallback(() => {
      E.downloadMidi(patternRef.current, 'big-daddy-jam.mid');
    }, []);

    /* --- clearing ---------------------------------------------------- */
    const clearDrums = React.useCallback(() => {
      setPattern((p) => Object.assign({}, p, {
        drums: p.drums.map((row) => row.map(() => false)),
        sample: p.sample.map(() => false)
      }));
    }, []);
    const clearKeys = React.useCallback(() => {
      setPattern((p) => Object.assign({}, p, {
        layers: p.layers.map((layer) => Object.assign({}, layer, { notes: [] }))
      }));
    }, []);
    const clearAll = React.useCallback(() => {
      setPattern((p) => {
        const fresh = E.emptyPattern();
        fresh.bpm = p.bpm;
        // Keep the voices they picked; only the notes go.
        fresh.layers.forEach((layer, i) => { layer.voice = p.layers[i].voice; });
        return fresh;
      });
    }, []);

    return (
      <React.Fragment>
        <JamNav />
        <JamIntro source={loaded.source} />
        <Studio
          pattern={pattern}
          bpm={pattern.bpm}
          playing={playing}
          recording={recording}
          metronome={metronome}
          uiStep={uiStep}
          baseMidi={baseMidi}
          down={down}
          selectedLayer={selectedLayer}
          sampleState={sampleState}
          sampleKeyboard={sampleKeyboard}
          onPlay={togglePlay}
          onRecord={toggleRecord}
          onMetronome={() => setMetronome((m) => !m)}
          onBpm={(v) => setPattern((p) => Object.assign({}, p, { bpm: v }))}
          onToggle={toggleCell}
          onToggleSample={toggleSampleCell}
          onAudition={audition}
          onPress={pressNote}
          onRelease={releaseNote}
          onOctave={(d) => setBaseMidi((m) => Math.min(84, Math.max(24, m + d * 12)))}
          onSelectLayer={setSelectedLayer}
          onLayerVoice={setLayerVoice}
          onLayerMute={toggleMute}
          onLayerSolo={toggleSolo}
          onLayerClear={clearLayer}
          onSampleRecord={startSample}
          onSampleStop={stopSample}
          onSamplePlay={() => { E.ensureAudio(); E.playSample(); }}
          onSampleClear={clearSample}
          onSampleKeyboard={setSampleKeyboard}
          arrange={{
            rangeIndex, scope, pasteBeat,
            hasClip: !!clip,
            clipNote: clip ? 'holding ' + clip.label + ' · ' + clip.scopeLabel : '',
            onRange: setRangeIndex,
            onScope: setScope,
            onPasteBeat: setPasteBeat,
            onCopy: doCopy,
            onPaste: doPaste,
            onDouble: doDouble
          }}
          onClearDrums={clearDrums}
          onClearKeys={clearKeys}
          onClearAll={clearAll}
        />
        <SendPanel pattern={pattern} loopCode={loopCode} loopLink={loopLink} onDownload={download} />
        <JamFooter />
      </React.Fragment>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<JamPage />);
  </script>
</body>
</html>
