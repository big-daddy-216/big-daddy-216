  /* =================================================================
     THE PAGE — all the state lives here.
     ================================================================= */
  function JamPage() {
    const [loaded, setLoaded] = React.useState(readLoopFromUrl);
    const [pattern, setPattern] = React.useState(loaded.pattern);
    const [playing, setPlaying] = React.useState(false);
    const [recording, setRecording] = React.useState(false);
    const [metronome, setMetronome] = React.useState(false);
    const [uiStep, setUiStep] = React.useState(-1);
    const [baseMidi, setBaseMidi] = React.useState(60);   // middle C
    const [down, setDown] = React.useState({});
    const [selectedLayer, setSelectedLayer] = React.useState(0);

    // Arranging
    const [clip, setClip] = React.useState(null);
    const [rangeIndex, setRangeIndex] = React.useState(0);   // "Beats 1–2", the first half of one bar
    const [pasteBeat, setPasteBeat] = React.useState(2);     // start of the second half
    // Set while "1 Bar" is waiting for a second click to confirm dropping
    // the back half of a two-bar loop that has something in it.
    const [pendingLength, setPendingLength] = React.useState(null);
    const [scope, setScope] = React.useState('all');

    // The microphone pad
    const [sampleState, setSampleState] = React.useState({
      seconds: null, recording: false, error: null, countdown: 0, version: 0
    });
    const [sampleKeyboard, setSampleKeyboard] = React.useState(false);

    /* --- the board -------------------------------------------------
       `previewId` is the jam whose loop is currently coming out of the
       speakers. There is one transport and one audio context, so the
       studio and the board take turns rather than playing over each
       other; whichever starts stops the other first. */
    const [board, setBoard] = React.useState({
      jams: [], patterns: {}, cursor: null, hasMore: false, loading: false, error: null
    });
    const [filters, setFilters] = React.useState({ sort: 'recent', band: '', voice: '', hasSample: false });
    const [remixParent, setRemixParent] = React.useState(null);
    // A dismissed notice comes back if they pick a different jam to riff on.
    const [bannerHidden, setBannerHidden] = React.useState(false);
    React.useEffect(() => { setBannerHidden(false); }, [remixParent && remixParent.id]);
    const [previewId, setPreviewId] = React.useState(null);
    const [previewLoading, setPreviewLoading] = React.useState(null);
    const [mayPost, setMayPost] = React.useState(false);
    const [mine, setMine] = React.useState(() => (PUBLISH_READY ? readMine() : {}));
    const previewRef = React.useRef(null);
    const cursorRef = React.useRef(null);
    cursorRef.current = board.cursor;

    /* The scheduler runs on a timer, outside React's render cycle. If it
       read state directly it would capture the values from the render
       that started it and never see a tempo change, so it reads refs. */
    const patternRef = React.useRef(pattern);
    patternRef.current = pattern;
    const metronomeRef = React.useRef(metronome);
    metronomeRef.current = metronome;
    const recordingRef = React.useRef(recording);
    recordingRef.current = recording;
    const baseMidiRef = React.useRef(baseMidi);
    baseMidiRef.current = baseMidi;
    const selectedRef = React.useRef(selectedLayer);
    selectedRef.current = selectedLayer;
    const sampleKbdRef = React.useRef(sampleKeyboard);
    sampleKbdRef.current = sampleKeyboard;

    const heldRef = React.useRef({});      // midi -> live note handle
    const kbdRef = React.useRef({});       // computer key -> the midi it started

    const transportState = React.useCallback(() => ({
      pattern: patternRef.current,
      bpm: patternRef.current.bpm,
      metronome: metronomeRef.current,
      sampleSlot: 'studio'
    }), []);

    /* The board plays through the same transport, but reads a different
       pattern and a different sample slot — so previewing somebody's jam
       can't sound, or overwrite, the visitor's own recording. */
    const previewState = React.useCallback(() => {
      const p = previewRef.current || E.emptyPattern();
      return { pattern: p, bpm: p.bpm, metronome: false, sampleSlot: 'preview' };
    }, []);

    /* --- transport ------------------------------------------------- */
    const claimTransport = React.useCallback(() => {
      E.stop();                       // takes it back from the board if it had it
      E.useSample('studio');
      previewRef.current = null;
      setPreviewId(null);
    }, []);

    const togglePlay = React.useCallback(() => {
      if (E.isPlaying() && E.transportOwner() !== 'studio') {
        // A board preview ("Hear the original", or a card on the wall)
        // is what's sounding. Stop means stop that, not start the studio.
        claimTransport();
        return;
      }
      if (E.isPlaying()) {
        E.stop();
        setPlaying(false);
        setRecording(false);
      } else {
        // Called straight from a click, which is what lets audio start.
        claimTransport();
        E.start(transportState, 'studio');
        setPlaying(true);
      }
    }, [transportState, claimTransport]);

    const toggleRecord = React.useCallback(() => {
      setRecording((r) => {
        const next = !r;
        // Arming record with the transport stopped is a dead end, so
        // start it rolling too.
        if (next && (!E.isPlaying() || E.transportOwner() !== 'studio')) {
          claimTransport();
          E.start(transportState, 'studio');
          setPlaying(true);
        }
        return next;
      });
    }, [transportState]);

    /* --- playhead --------------------------------------------------
       Driven off the audio clock, and only calls setState when the step
       actually changes — thirty-two times a bar pair, not sixty times a
       second. */
    React.useEffect(() => {
      if (!playing && !previewId) { setUiStep(-1); return undefined; }
      let raf = 0, alive = true, drawn = -1;
      const tick = () => {
        if (!alive) return;
        const s = E.currentPlayStep();
        if (s !== drawn) { drawn = s; setUiStep(s); }
        raf = window.requestAnimationFrame(tick);
      };
      raf = window.requestAnimationFrame(tick);
      return () => { alive = false; window.cancelAnimationFrame(raf); };
    }, [playing, previewId]);

    // Stop the transport if the page goes away mid-loop.
    React.useEffect(() => () => E.stop(), []);

    /* Following a loop link while this page is already open only changes
       the part after the # — the browser doesn't reload, so without this
       the new loop would be silently ignored. */
    React.useEffect(() => {
      const onHash = () => {
        const next = readLoopFromUrl();
        if (next.source === 'new') return;      // hash cleared, nothing to load
        setLoaded(next);
        // A link that won't decode is worth saying so about, but it is
        // not worth throwing away whatever the visitor already built.
        if (next.source !== 'link') return;
        E.stop();
        setPlaying(false);
        setRecording(false);
        setPattern(next.pattern);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
      window.addEventListener('hashchange', onHash);
      return () => window.removeEventListener('hashchange', onHash);
    }, []);

    /* --- editing the pattern --------------------------------------- */
    const toggleCell = React.useCallback((lane, step) => {
      E.ensureAudio();
      const turningOn = !patternRef.current.drums[lane][step];

      /* Preview the hit only while the transport is stopped. Once it's
         rolling, the sequencer is already playing the pattern, and an
         extra hit fired off-grid the instant you tap a cell muddies
         what you're trying to listen to. */
      if (turningOn && !E.isPlaying()) E.playDrum(E.LANES[lane].id);

      setPattern((p) => Object.assign({}, p, {
        drums: p.drums.map((row, i) =>
          i === lane ? row.map((on, s) => (s === step ? !on : on)) : row)
      }));
    }, []);

    const toggleSampleCell = React.useCallback((step) => {
      E.ensureAudio();
      const turningOn = !patternRef.current.sample[step];
      if (turningOn && !E.isPlaying()) E.playSample(undefined, null, null, 'studio');
      setPattern((p) => Object.assign({}, p, {
        sample: p.sample.map((on, s) => (s === step ? !on : on))
      }));
    }, []);

    const audition = React.useCallback((laneId) => {
      E.ensureAudio();
      E.playDrum(laneId);
    }, []);

    const addNote = React.useCallback((layerIndex, note) => {
      setPattern((p) => Object.assign({}, p, {
        layers: p.layers.map((layer, i) => {
          if (i !== layerIndex) return layer;
          if (layer.notes.length >= E.MAX_NOTES) return layer;
          // Replace rather than stack when the same pitch is played on
          // the same step twice, so overdubbing doesn't pile up copies.
          const kept = layer.notes.filter(
            (n) => !(n.step === note.step && n.midi === note.midi));
          return Object.assign({}, layer, { notes: kept.concat([note]) });
        })
      }));
    }, []);

    /* --- layers ----------------------------------------------------- */
    const updateLayer = React.useCallback((index, changes) => {
      setPattern((p) => Object.assign({}, p, {
        layers: p.layers.map((layer, i) =>
          i === index ? Object.assign({}, layer, changes) : layer)
      }));
    }, []);

    const setLayerVoice = React.useCallback((i, voice) => {
      updateLayer(i, { voice });
      setSelectedLayer(i);
    }, [updateLayer]);

    const toggleMute = React.useCallback((i) => {
      setPattern((p) => Object.assign({}, p, {
        layers: p.layers.map((layer, j) =>
          j === i ? Object.assign({}, layer, { muted: !layer.muted }) : layer)
      }));
    }, []);

    const toggleSolo = React.useCallback((i) => {
      setPattern((p) => Object.assign({}, p, {
        layers: p.layers.map((layer, j) =>
          j === i ? Object.assign({}, layer, { solo: !layer.solo }) : layer)
      }));
    }, []);

    const clearLayer = React.useCallback((i) => updateLayer(i, { notes: [] }), [updateLayer]);
    const setLayerVolume = React.useCallback((i, v) => updateLayer(i, { volume: v }), [updateLayer]);

    /* --- playing notes --------------------------------------------- */
    const pressNote = React.useCallback((midi) => {
      if (heldRef.current[midi]) return;             // already down

      /* With the sample pad switched over to the keyboard, the keys fire
         the recording pitched up and down instead of a synth voice. It's
         a one-shot, so there's nothing to release. */
      if (sampleKbdRef.current && E.hasSample()) {
        E.playSample(null, midi);
        setDown((d) => Object.assign({}, d, { [midi]: true }));
        window.setTimeout(() => setDown((d) => {
          const next = Object.assign({}, d);
          delete next[midi];
          return next;
        }), 140);
        return;
      }

      const layerIndex = selectedRef.current;
      const layer = patternRef.current.layers[layerIndex];
      const handle = E.noteOn(layer.voice, midi, 100, E.layerLevel(layer));
      heldRef.current[midi] = {
        handle: handle,
        layer: layerIndex,
        step: E.isPlaying() ? E.liveStep() : null,
        at: E.now()
      };
      setDown((d) => Object.assign({}, d, { [midi]: true }));
    }, []);

    const releaseNote = React.useCallback((midi) => {
      const held = heldRef.current[midi];
      if (!held) return;
      delete heldRef.current[midi];
      E.noteOff(held.handle);
      setDown((d) => {
        const next = Object.assign({}, d);
        delete next[midi];
        return next;
      });

      if (recordingRef.current && held.step !== null) {
        const stepDur = E.stepDuration(patternRef.current.bpm);
        const heldFor = Math.max(E.now() - held.at, 0);
        const len = Math.min(Math.max(Math.round(heldFor / stepDur), 1), stepsOf(patternRef.current));
        addNote(held.layer, { step: held.step, midi: midi, len: len, velocity: 100 });
      }
    }, [addNote]);

    /* --- computer keyboard ------------------------------------------
       Handlers live in refs so the listeners bind once and never go
       stale. Which midi note a key started is remembered, so changing
       octave mid-press can't strand a note ringing. */
    const fns = React.useRef({});
    fns.current = { togglePlay, pressNote, releaseNote };

    React.useEffect(() => {
      const inField = (el) => !!el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName);

      const onDown = (e) => {
        if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
        if (inField(e.target)) return;

        if (e.code === 'Space') { e.preventDefault(); fns.current.togglePlay(); return; }
        if (e.key === 'ArrowLeft')  { e.preventDefault(); setBaseMidi((m) => Math.max(24, m - 12)); return; }
        if (e.key === 'ArrowRight') { e.preventDefault(); setBaseMidi((m) => Math.min(84, m + 12)); return; }

        const k = e.key.toLowerCase();
        if (!(k in KEY_MAP) || kbdRef.current[k] != null) return;
        e.preventDefault();
        const midi = baseMidiRef.current + KEY_MAP[k];
        kbdRef.current[k] = midi;
        fns.current.pressNote(midi);
      };

      const onUp = (e) => {
        const k = e.key.toLowerCase();
        const midi = kbdRef.current[k];
        if (midi == null) return;
        delete kbdRef.current[k];
        fns.current.releaseNote(midi);
      };

      // Leaving the window swallows the keyup, which would leave notes
      // ringing until the engine's own safety net cuts them off.
      const onBlur = () => {
        Object.keys(kbdRef.current).forEach((k) => {
          const midi = kbdRef.current[k];
          delete kbdRef.current[k];
          fns.current.releaseNote(midi);
        });
      };

      window.addEventListener('keydown', onDown);
      window.addEventListener('keyup', onUp);
      window.addEventListener('blur', onBlur);
      return () => {
        window.removeEventListener('keydown', onDown);
        window.removeEventListener('keyup', onUp);
        window.removeEventListener('blur', onBlur);
      };
    }, []);

    /* --- arranging --------------------------------------------------- */
    const doCopy = React.useCallback(() => {
      const r = copyRangesFor(stepsOf(patternRef.current))[rangeIndex];
      if (!r) return;
      setClip(Object.assign(E.copyRange(patternRef.current, r.from, r.len, scope), {
        label: r.label, scopeLabel: (SCOPES.find((sc) => sc.value === scope) || {}).label
      }));
    }, [rangeIndex, scope]);

    const doPaste = React.useCallback(() => {
      if (!clip) return;
      setPattern((p) => E.pasteRange(p, clip, pasteBeat * E.STEPS_PER_BEAT));
    }, [clip, pasteBeat]);

    const doDouble = React.useCallback(() => {
      setPattern((p) => E.duplicateFirstHalf(p));
    }, []);

    /* Switching length. Growing is always safe. Shrinking a loop that
       has anything in its back half needs a second click on the same
       button, which is the confirmation — no dialog, and clicking
       anything else cancels it. The transport is stopped either way,
       because the playhead position stops meaning anything when the
       loop changes size underneath it. */
    const setLength = React.useCallback((nextSteps) => {
      const p = patternRef.current;
      const cur = stepsOf(p);
      if (nextSteps === cur) { setPendingLength(null); return; }

      const shrinking = nextSteps < cur;
      if (shrinking && E.contentBeyond(p, nextSteps) && pendingLength !== nextSteps) {
        setPendingLength(nextSteps);
        return;
      }

      setPendingLength(null);
      if (E.isPlaying()) { E.stop(); setPlaying(false); setRecording(false); }
      setClip(null);                                  // clip offsets no longer line up
      setRangeIndex(nextSteps === 32 ? 4 : 0);        // "first half" in either menu
      setPasteBeat(nextSteps / E.STEPS_PER_BEAT / 2); // start of the second half
      setPattern((prev) => E.changeLength(prev, nextSteps));
    }, [pendingLength]);

    // Anything else the visitor does cancels a pending shorten.
    React.useEffect(() => {
      if (pendingLength === null) return undefined;
      const cancel = (e) => {
        if (e.target && e.target.closest && e.target.closest('.jam-length')) return;
        setPendingLength(null);
      };
      window.addEventListener('pointerdown', cancel, true);
      return () => window.removeEventListener('pointerdown', cancel, true);
    }, [pendingLength]);

    /* --- the microphone ---------------------------------------------- */
    const countdownRef = React.useRef(null);

    const stopCountdown = () => {
      if (countdownRef.current) {
        window.clearInterval(countdownRef.current);
        countdownRef.current = null;
      }
    };

    const startSample = React.useCallback(() => {
      E.ensureAudio();
      setSampleState((s) => Object.assign({}, s, {
        error: null, recording: true, countdown: E.MAX_SAMPLE_SECONDS
      }));

      stopCountdown();
      countdownRef.current = window.setInterval(() => {
        setSampleState((s) => Object.assign({}, s, {
          countdown: Math.max(0, s.countdown - 1)
        }));
      }, 1000);

      E.recordSample(E.MAX_SAMPLE_SECONDS).then((info) => {
        stopCountdown();
        setSampleState((s) => ({ seconds: info.seconds, recording: false, error: null, countdown: 0, version: s.version + 1 }));
      }, (err) => {
        stopCountdown();
        setSampleState({
          seconds: E.hasSample() ? (E.sampleInfo() || {}).seconds : null,
          recording: false,
          error: (err && err.message) || 'unsupported',
          countdown: 0
        });
      });
    }, []);

    const stopSample = React.useCallback(() => E.stopSampleRecording(), []);

    // After a bake the recording IS the edited version, so the editor
    // starts over from clean settings on the new waveform.
    const sampleBaked = React.useCallback((info) => {
      setSampleState((s) => Object.assign({}, s, { seconds: info.seconds, version: s.version + 1 }));
    }, []);

    const clearSample = React.useCallback(() => {
      E.clearSample();
      setSampleKeyboard(false);
      setSampleState({ seconds: null, recording: false, error: null, countdown: 0 });
      // The lane is meaningless without the audio behind it.
      setPattern((p) => Object.assign({}, p, { sample: p.sample.map(() => false) }));
    }, []);

    React.useEffect(() => stopCountdown, []);

    /* --- the board ------------------------------------------------- */

    const loadBoard = React.useCallback((append) => {
      if (!PUBLISH_READY) return;
      setBoard((b) => Object.assign({}, b, { loading: true, error: null }));

      const query = { sort: filters.sort, limit: 24 };
      if (filters.band) {
        const parts = filters.band.split('-');
        query.bpm_min = parts[0];
        query.bpm_max = parts[1];
      }
      if (filters.voice) query.voice = filters.voice;
      if (filters.hasSample) query.has_sample = '1';
      if (append && cursorRef.current) query.cursor = cursorRef.current;

      API.list(query).then((data) => {
        setBoard((b) => {
          const jams = append ? b.jams.concat(data.jams) : data.jams;
          const patterns = Object.assign({}, append ? b.patterns : {});
          // Decoded once here rather than on every render of every card.
          data.jams.forEach((j) => { patterns[j.id] = E.decodeLoop(j.loop); });
          return { jams, patterns, cursor: data.cursor, hasMore: data.has_more, loading: false, error: null };
        });
      }).catch(() => {
        setBoard((b) => Object.assign({}, b, {
          loading: false,
          error: 'The board could not be reached just now. Everything else on this page still works.'
        }));
      });
    }, [filters]);

    React.useEffect(() => { loadBoard(false); }, [loadBoard]);

    React.useEffect(() => {
      if (!PUBLISH_READY) return;
      API.mayPost().then((r) => setMayPost(!!r.may_post)).catch(() => {});
    }, []);

    const playPreview = React.useCallback((jam) => {
      const pattern = board.patterns[jam.id] || E.decodeLoop(jam.loop);
      if (!pattern) return;

      E.ensureAudio();
      E.stop();
      setPlaying(false);
      setRecording(false);

      const begin = () => {
        previewRef.current = pattern;
        E.useSample('preview');
        E.start(previewState, 'board:' + jam.id);
        setPreviewId(jam.id);
      };

      if (jam.sample) {
        setPreviewLoading(jam.id);
        E.loadSampleFromUrl(jam.sample.url, 'preview')
          .catch(() => { E.clearSample('preview'); })   // rather play it dry than not at all
          .then(() => { setPreviewLoading(null); begin(); });
      } else {
        E.clearSample('preview');
        begin();
      }
    }, [board.patterns, previewState]);

    const stopPreview = React.useCallback(() => {
      E.stop();
      E.useSample('studio');
      previewRef.current = null;
      setPreviewId(null);
    }, []);

    /* Picking somebody's loop up. Their jam is untouched — this only
       fills the studio and remembers whose it was, so that publishing
       posts a new jam pointing back at theirs. */
    const remixFrom = React.useCallback((jam) => {
      const pattern = board.patterns[jam.id] || E.decodeLoop(jam.loop);
      if (!pattern) return;

      E.stop();
      E.useSample('studio');
      previewRef.current = null;
      setPreviewId(null);
      setPlaying(false);
      setRecording(false);
      setPattern(pattern);
      setRemixParent({ id: jam.id, title: jam.title, author: jam.author, hasSample: !!jam.sample });

      /* Borrow their recording only when there is nothing of the
         visitor's own to lose. If they've recorded something, theirs
         stays put and the sample is inherited server-side at publish. */
      if (jam.sample && !E.hasSample('studio')) {
        E.loadSampleFromUrl(jam.sample.url, 'studio')
          .then((info) => setSampleState((s) => ({ seconds: info.seconds, recording: false, error: null, countdown: 0, version: s.version + 1 })))
          .catch(() => {});
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, [board.patterns]);

    const openLineage = React.useCallback((id) => {
      API.get(id).then((data) => {
        setBoard((b) => {
          if (b.jams.some((j) => j.id === data.jam.id)) return b;
          const patterns = Object.assign({}, b.patterns);
          patterns[data.jam.id] = E.decodeLoop(data.jam.loop);
          return Object.assign({}, b, { jams: [data.jam].concat(b.jams), patterns });
        });
        const el = document.getElementById('board');
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      }).catch(() => {});
    }, []);

    const withdrawJam = React.useCallback((jam) => {
      const token = readMine()[jam.id];
      if (!token) return;
      if (!window.confirm('Take "' + jam.title + '" down? Anything other people built on it stays up.')) return;
      API.retract(jam.id, token).then(() => {
        forgetMine(jam.id);
        setMine(readMine());
        if (previewId === jam.id) stopPreview();
        setBoard((b) => Object.assign({}, b, { jams: b.jams.filter((j) => j.id !== jam.id) }));
      }).catch(() => {
        window.alert('That could not be withdrawn just now. Try again in a moment.');
      });
    }, [previewId, stopPreview]);

    const afterPublish = React.useCallback(() => {
      setMine(readMine());
      setRemixParent(null);
      loadBoard(false);
    }, [loadBoard]);

    /* A ?jam=<id> link opens that jam ready to be built on, the same as
       tapping "Jam on this". The older #loop=<code> links still work
       untouched — they're in emails, and they don't need the API. */
    React.useEffect(() => {
      if (!PUBLISH_READY) return;
      const id = new URLSearchParams(window.location.search).get('jam');
      if (!id) return;
      API.get(id).then((data) => {
        const pattern = E.decodeLoop(data.jam.loop);
        if (!pattern) return;
        setPattern(pattern);
        setRemixParent({
          id: data.jam.id, title: data.jam.title,
          author: data.jam.author, hasSample: !!data.jam.sample
        });
      }).catch(() => {});
    }, []);

    /* --- sharing ---------------------------------------------------- */
    const loopCode = E.encodeLoop(pattern);
    const base = (CONFIG.siteUrl || 'https://bigdaddyand.co/jam').replace(/#.*$/, '');
    const loopLink = base + '#loop=' + loopCode;

    const download = React.useCallback(() => {
      E.downloadMidi(patternRef.current, 'big-daddy-jam.mid');
    }, []);

    /* --- clearing ---------------------------------------------------- */
    const clearDrums = React.useCallback(() => {
      setPattern((p) => Object.assign({}, p, {
        drums: p.drums.map((row) => row.map(() => false)),
        sample: p.sample.map(() => false)
      }));
    }, []);
    const clearKeys = React.useCallback(() => {
      setPattern((p) => Object.assign({}, p, {
        layers: p.layers.map((layer) => Object.assign({}, layer, { notes: [] }))
      }));
    }, []);
    /* Starting over means starting over: keeping the parent would post an
       unrelated loop claiming to be built on somebody's work. */
    const clearAll = React.useCallback(() => {
      setRemixParent(null);
      setPattern((p) => {
        const fresh = E.emptyPattern(stepsOf(p));
        fresh.bpm = p.bpm;
        // Keep the voices they picked; only the notes go.
        fresh.layers.forEach((layer, i) => { layer.voice = p.layers[i].voice; });
        return fresh;
      });
    }, []);

    return (
      <React.Fragment>
        <SiteNav current="jam" cta={{ label: 'Back to the Band', href: 'index.html', variant: 'outline' }} />
        <JamIntro source={loaded.source} />
        <Studio
          banner={remixParent && !bannerHidden ? (
            <RemixBanner
              parent={remixParent}
              onClear={() => setRemixParent(null)}
              onDismiss={() => setBannerHidden(true)}
              onHearOriginal={() => {
                const jam = board.jams.filter((j) => j.id === remixParent.id)[0];
                if (jam) playPreview(jam); else openLineage(remixParent.id);
              }}
            />
          ) : null}
          pattern={pattern}
          bpm={pattern.bpm}
          playing={playing}
          previewTitle={previewId === null ? null
            : ((board.jams.find((j) => j.id === previewId) || {}).title
               || (remixParent && remixParent.id === previewId ? remixParent.title : null)
               || 'the original')}
          recording={recording}
          metronome={metronome}
          uiStep={uiStep}
          baseMidi={baseMidi}
          down={down}
          selectedLayer={selectedLayer}
          sampleState={sampleState}
          sampleKeyboard={sampleKeyboard}
          onPlay={togglePlay}
          onRecord={toggleRecord}
          onMetronome={() => setMetronome((m) => !m)}
          onBpm={(v) => setPattern((p) => Object.assign({}, p, { bpm: v }))}
          onToggle={toggleCell}
          onToggleSample={toggleSampleCell}
          onAudition={audition}
          onPress={pressNote}
          onRelease={releaseNote}
          onOctave={(d) => setBaseMidi((m) => Math.min(84, Math.max(24, m + d * 12)))}
          onSelectLayer={setSelectedLayer}
          onLayerVoice={setLayerVoice}
          onLayerVolume={setLayerVolume}
          onLayerMute={toggleMute}
          onLayerSolo={toggleSolo}
          onLayerClear={clearLayer}
          onSampleRecord={startSample}
          onSampleStop={stopSample}
          onSamplePlay={() => { E.ensureAudio(); E.playSample(undefined, null, null, 'studio'); }}
          onSampleClear={clearSample}
          onSampleBaked={sampleBaked}
          onSampleKeyboard={setSampleKeyboard}
          steps={stepsOf(pattern)}
          pendingLength={pendingLength}
          onLength={setLength}
          arrange={{
            rangeIndex, scope, pasteBeat,
            ranges: copyRangesFor(stepsOf(pattern)),
            beats: stepsOf(pattern) / E.STEPS_PER_BEAT,
            doubleHint: stepsOf(pattern) === 32
              ? 'makes beats 5–8 match beats 1–4'
              : 'makes beats 3–4 match beats 1–2',
            hasClip: !!clip,
            clipNote: clip ? 'holding ' + clip.label + ' · ' + clip.scopeLabel : '',
            onRange: setRangeIndex,
            onScope: setScope,
            onPasteBeat: setPasteBeat,
            onCopy: doCopy,
            onPaste: doPaste,
            onDouble: doDouble
          }}
          onClearDrums={clearDrums}
          onClearKeys={clearKeys}
          onClearAll={clearAll}
        />
        <PublishPanel
          pattern={pattern}
          parent={remixParent}
          sampleState={sampleState}
          mayPost={mayPost}
          onNeedSignIn={setMayPost}
          onPublished={afterPublish}
          onSampleBaked={sampleBaked}
        />
        <JamBoard
          state={board}
          filters={filters}
          mine={mine}
          playingId={previewId}
          playStep={uiStep}
          loadingId={previewLoading}
          onFilters={(patch) => setFilters((f) => Object.assign({}, f, patch))}
          onPlay={playPreview}
          onStop={stopPreview}
          onRemix={remixFrom}
          onWithdraw={withdrawJam}
          onOpenLineage={openLineage}
          onMore={() => loadBoard(true)}
        />
        <SendPanel pattern={pattern} loopCode={loopCode} loopLink={loopLink} onDownload={download} />
        <JamFooter />
      </React.Fragment>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<JamPage />);
  </script>
</body>
</html>
