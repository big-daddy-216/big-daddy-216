         WHOLE ACCOUNT, not per form. Loops from this page draw on the
         same allowance as the TES contact and ticket forms, so a busy
         month here eats into that.
       • The TES back-end reads those notification emails and files them
         as CRM leads. Every submission from this page carries the marker
         below so it gets skipped instead of becoming a fake lead — see
         `_Reference/FORM_SUBMISSION_WORKFLOW_README.md` in TES_Back-End.
         If you change the marker, change it there too.

       To point this somewhere else later, swap `formEndpoint` for another
       Formspree form ("https://formspree.io/f/xxxxxxxx"). The endpoint is
       public by design — it only ever lets someone send mail TO you.
       ======================================================================== -->

  <script type="text/babel">
  /* Big Daddy and Co. — "Join the Company" jam page.
     Uses the shared design-system primitives, same as index.html. */

  const { Wordmark, Button, Stamp, SectionHeading, Card, Field } =
    window.NashSMomDesignSystem_77335a;

  const E = window.BDJam;                 // the sound + MIDI engine
  const CONFIG = window.BD_JAM || {};
  /* Loop length belongs to the pattern now, not the page. These build
     the per-render helpers from whatever length the current loop has. */
  const stepsOf = (pattern) => E.patternSteps(pattern);
  const stepList = (count) => Array.from({ length: count }, (_, i) => i);
  const BAR_STEPS = 16;

  /* Is the Formspree endpoint actually filled in? Until it is, the page
     has to say so rather than fake a successful send. */
  const FORM_READY = !!CONFIG.formEndpoint && /^https:\/\/formspree\.io\/f\/\w+$/.test(CONFIG.formEndpoint);

  /* -----------------------------------------------------------------
     COMPUTER-KEYBOARD LAYOUT
     -----------------------------------------------------------------
     Every one of the 25 keys on screen is playable without moving your
     hands, by treating the computer keyboard as two little pianos
     stacked on top of each other:

       upper octave   q 2 w 3 e r 5 t 6 y 7 u i
       lower octave   z s x d c v g b h n j m , l . ; /

     In each pair, the flat row is the white notes and the row above it
     holds their sharps — sitting where the black keys would be. This is
     the layout trackers and DAWs have used for decades, and it happens
     to fit exactly: seventeen slots on the bottom, thirteen up top, and
     no key on screen left stranded.

     The two rows deliberately overlap in the middle (the bottom row runs
     five notes into the upper octave), which is what lets you play
     across the join without jumping rows. */
  const LOWER_ROW_KEYS = ['z', 's', 'x', 'd', 'c', 'v', 'g', 'b', 'h', 'n', 'j', 'm', ',', 'l', '.', ';', '/'];
  const UPPER_ROW_KEYS = ['q', '2', 'w', '3', 'e', 'r', '5', 't', '6', 'y', '7', 'u', 'i'];

  const KEY_MAP = {};
  LOWER_ROW_KEYS.forEach((k, i) => { KEY_MAP[k] = i; });          // semitones 0–16
  UPPER_ROW_KEYS.forEach((k, i) => { KEY_MAP[k] = i + 12; });     // semitones 12–24

  /* What to print on each key. Where both rows reach a note, the upper
     row wins the label, so the second octave on screen reads as the
     top row of the computer keyboard. The lower-row key still works. */
  const HINT_FOR_SEMI = {};
  LOWER_ROW_KEYS.forEach((k, i) => { HINT_FOR_SEMI[i] = k; });
  UPPER_ROW_KEYS.forEach((k, i) => { HINT_FOR_SEMI[i + 12] = k; });

  const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  const WHITE_SEMIS = [0, 2, 4, 5, 7, 9, 11];
  const BLACK_AFTER = [0, 1, 3, 4, 5];   // which white key each black sits after

  function noteLabel(midi) {
    return NOTE_NAMES[midi % 12] + (Math.floor(midi / 12) - 1);
  }

  /* The keyboard is built as two octave-sized groups rather than one
     long run of keys. Side by side on a wide screen they read as a
     single continuous keyboard; on a phone they stack instead, which
     doubles the width of every key and makes them big enough to hit
     with a thumb. Same notes either way.

     The lower group is a plain octave (seven white keys); the upper one
     carries the extra C that closes the keyboard off (eight). */
  function buildOctaveGroup(baseMidi, startSemi, whiteCount) {
    const whites = [];
    for (let i = 0; i < whiteCount; i++) {
      const semi = startSemi + (i < WHITE_SEMIS.length ? WHITE_SEMIS[i] : 12);
      whites.push({ semi, midi: baseMidi + semi });
    }
    const blacks = BLACK_AFTER.map((wi) => {
      const semi = startSemi + WHITE_SEMIS[wi] + 1;
      return { semi, midi: baseMidi + semi, afterWhite: wi };
    });
    return { whites, blacks, whiteCount };
  }

  function buildKeyboard(baseMidi) {
    return [
      buildOctaveGroup(baseMidi, 0, 7),
      buildOctaveGroup(baseMidi, 12, 8)
    ];
  }

  /* Read a loop out of the address bar, if someone followed a link.
     The part after the # is never sent to any server — it only ever
     travels in the email — so a loop stays between the sender and the
     band. */
  function readLoopFromUrl() {
    const m = /(?:^|[#&])loop=([A-Za-z0-9_\-]+)/.exec(window.location.hash || '');
    if (!m) return { pattern: E.emptyPattern(), source: 'new' };
    const decoded = E.decodeLoop(m[1]);
    return decoded
      ? { pattern: decoded, source: 'link' }
      : { pattern: E.emptyPattern(), source: 'broken' };
  }

     NAV — the shared top bar lives in assets/js/site-nav.js, so there is

     This page only says which link is the current one.

     INTRO — the job posting.
     ================================================================= */

        <div className="nm-container jam-intro" style={{ position: 'relative', zIndex: 2 }}>
         <div>
          <SectionHeading kicker="Careers · Now Hiring" title={<span>Jam<br/>With Us!</span>} glow />
          <p style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--fs-lead)',
                      color: 'var(--bone-300)', marginTop: 22, maxWidth: 640, lineHeight: 1.5 }}>
            <strong style={{ color: 'var(--bone-100)' }}>Big Daddy and Co. is growing.</strong>{' '}
            We're a Cleveland jam band with four guys, one shed, and no HR department to speak of,
            and we are actively seeking talent for jams, gigs, and whatever it is we're doing on a

          </p>

            Program a beat, play something over it, give it your absolute best, and submit it below

  /* =================================================================
     TRANSPORT — play, record, metronome, tempo.
     (Voice lives on each layer now, not up here.)
     ================================================================= */
  function Transport(props) {
    return (
      <div className="jam-transport">
        <div className="jam-transport-group">
          <Button variant={props.playing ? 'flag' : 'primary'} size="md" onClick={props.onPlay}>
            {props.playing ? 'Stop' : 'Play'}
          </Button>
          <Button variant={props.recording ? 'flag' : 'outline'} size="md"

                  aria-pressed={props.recording}>

          </Button>
          <Button variant={props.metronome ? 'primary' : 'ghost'} size="sm"
                  onClick={props.onMetronome} aria-pressed={props.metronome}>
            Click
          </Button>
        </div>

        <div className="jam-tempo">
          <span className="jam-tempo-unit">Tempo</span>
          <input type="range" min={E.BPM_MIN} max={E.BPM_MAX} value={props.bpm}
                 aria-label="Tempo in beats per minute"
                 onChange={(e) => props.onBpm(Number(e.target.value))} />
          <span className="jam-tempo-readout">{props.bpm}</span>
          <span className="jam-tempo-unit">BPM</span>
        </div>

        <div className="jam-transport-group jam-length">
          <span className="jam-tempo-unit">Length</span>
          {E.LENGTHS.map((opt) => {
            const active = props.steps === opt.steps;
            const pending = props.pendingLength === opt.steps;
            return (
              <Button key={opt.steps} size="sm"
                      variant={pending ? 'flag' : (active ? 'primary' : 'ghost')}
                      aria-pressed={active}

                      onClick={() => props.onLength(opt.steps)}>
                {pending ? 'Drop the back half?' : opt.label}

        <div className="jam-transport-group">
          <span className="jam-tempo-unit">

              ? 'Hearing “' + props.previewTitle + '”'

                ? 'Recording into ' + props.layerName

  /* =================================================================
     LAYERS — four independent keyboard tracks.

     The selected layer is the one the keyboard plays and the one new
     notes record into. Everything else keeps looping while you play,
     which is the whole point: lay something down, hear it come round,
     riff over the top of it.
     ================================================================= */
  function LayerStrip({ layers, selected, onSelect, onVoice, onVolume, onMute, onSolo, onClear }) {
    const anySolo = layers.some((l) => l.solo);
    return (
      <div className="jam-layers">
        {layers.map((layer, i) => {
          const silenced = anySolo ? !layer.solo : layer.muted;
          return (
            <div key={i}
                 className="jam-layer"
                 data-selected={selected === i}
                 data-silent={silenced}
                 onClick={() => onSelect(i)}>
              <div className="jam-layer-head">
                <span className="jam-layer-name">Layer {i + 1}</span>
                <span className="jam-layer-count">
                  {layer.notes.length || '—'}
                </span>
              </div>

              <select className="jam-select" value={layer.voice}
                      aria-label={'Voice for layer ' + (i + 1)}
                      onClick={(e) => e.stopPropagation()}
                      onChange={(e) => onVoice(i, e.target.value)}>
                {E.VOICES.map((v) => (
                  <option key={v.id} value={v.id}>{v.label}</option>
                ))}
              </select>

              <label className="jam-layer-vol" onClick={(e) => e.stopPropagation()}>
                <span className="jam-tempo-unit">Vol</span>
                <input type="range" min="0" max="1" step="0.01"
                       value={E.layerLevel(layer)}
                       aria-label={'Volume for layer ' + (i + 1)}
                       onChange={(e) => onVolume(i, Number(e.target.value))} />
                <span className="jam-layer-count">{Math.round(E.layerLevel(layer) * 100)}</span>
              </label>

              <div className="jam-layer-btns">
                <button type="button" className="jam-mini" data-on={layer.muted}
                        aria-pressed={!!layer.muted}
                        title={'Mute layer ' + (i + 1)}
                        onClick={(e) => { e.stopPropagation(); onMute(i); }}>Mute</button>
                <button type="button" className="jam-mini" data-on={layer.solo}
                        aria-pressed={!!layer.solo}
                        title={'Solo layer ' + (i + 1)}
                        onClick={(e) => { e.stopPropagation(); onSolo(i); }}>Solo</button>
                <button type="button" className="jam-mini"
                        title={'Clear layer ' + (i + 1)}
                        onClick={(e) => { e.stopPropagation(); onClear(i); }}>Clear</button>
              </div>
            </div>
          );
        })}
      </div>
    );
  }

  /* =================================================================
     ARRANGE — copy, paste, and the one-click "make the back half match
     the front half", which is most of what anyone actually wants.
     ================================================================= */
  /* The copyable chunks for a given loop length: every pair of beats,
     then each half. For one bar that's beats 1–2, 3–4, then 1–2 and
     3–4 as halves; for two bars it runs to beats 7–8 and halves 1–4 /
     5–8. Built from the length so the menu never offers a range the
     loop doesn't have. */
  function copyRangesFor(steps) {
    const perBeat = E.STEPS_PER_BEAT;
    const beats = steps / perBeat;
    const out = [];
    for (let b = 0; b < beats; b += 2) {
      out.push({ label: 'Beats ' + (b + 1) + '–' + (b + 2), from: b * perBeat, len: 2 * perBeat });
    }
    // Halves are only worth listing when they're bigger than a pair of
    // beats — in a one-bar loop, a half *is* two beats, and the menu
    // would just repeat itself.
    const half = steps / 2;
    const halfBeats = half / perBeat;
    if (halfBeats > 2) {
      out.push({ label: 'Beats 1–' + halfBeats, from: 0, len: half });
      out.push({ label: 'Beats ' + (halfBeats + 1) + '–' + beats, from: half, len: half });
    }
    return out;
  }

  const SCOPES = [
    { value: 'all',   label: 'Everything' },
    { value: 'drums', label: 'Drums only' },
    { value: 'keys',  label: 'Keys only' }
  ];

  function ArrangeBar(props) {

                  onChange={(e) => props.onPasteBeat(Number(e.target.value))}>

        <Button size="sm" variant={props.hasClip ? 'primary' : 'ghost'}
                disabled={!props.hasClip} onClick={props.onPaste}>Paste</Button>

        {props.clipNote && <span className="jam-arrange-hint">{props.clipNote}</span>}
      </div>

  }

  /* =================================================================
     SAMPLE PAD — record something with the microphone.

     The mic is only opened when this button is pressed. The recording
     stays on the visitor's machine unless they publish a jam to the
     board and tick "include my recording" — it is never in the loop
     link and can't be in the .mid, because a MIDI file stores notes
     rather than sound. The page says all of this plainly rather than
     letting anyone assume either way.
     ================================================================= */
  const MIC_MESSAGES = {
    denied: "Your browser blocked the microphone. If you want to try again, allow mic access for this site in the address bar and hit record.",
    'no-device': "No microphone turned up. Plug one in, or check nothing else has taken it over.",
    insecure: "Browsers only hand over the microphone on a secure connection, and this page isn't on one.",
    unsupported: "This browser won't let a web page record audio. Chrome, Firefox or a recent Safari will.",
    'decode-failed': "The recording came back in a format we couldn't read. Worth another go.",
    empty: "That came back silent — nothing was captured."
  };

  /* =================================================================
     SAMPLE EDITOR — turn four seconds of "hey" into an instrument.

     The waveform shows the whole recording; drag the handles (or drag
     across it) to choose the bit that plays. The controls underneath
     shape the sound. None of it touches the recording until "Set as
     cue", which bakes the cut and the effects into a new sample — and
     that's also what gets uploaded if the jam is published, so what
     the board hears is what the visitor heard.
     ================================================================= */
  const EDIT_CONTROLS = [
    { key: 'pitch',     label: 'Pitch',    min: -12,  max: 12,    step: 1,    fmt: (v) => (v > 0 ? '+' : '') + v + ' st' },
    { key: 'lowpass',   label: 'Low-pass', min: 200,  max: 20000, step: 50,   fmt: (v) => v >= 20000 ? 'off' : (v >= 1000 ? (v / 1000).toFixed(1) + 'k' : v + ' Hz'), log: true },
    { key: 'highpass',  label: 'High-pass',min: 0,    max: 8000,  step: 20,   fmt: (v) => v < 20 ? 'off' : (v >= 1000 ? (v / 1000).toFixed(1) + 'k' : v + ' Hz'), log: true },
    { key: 'resonance', label: 'Resonance',min: 0.5,  max: 12,    step: 0.1,  fmt: (v) => v.toFixed(1) },
    { key: 'drive',     label: 'Drive',    min: 0,    max: 1,     step: 0.01, fmt: (v) => Math.round(v * 100) + '%' },
    { key: 'echo',      label: 'Echo',     min: 0,    max: 1,     step: 0.01, fmt: (v) => Math.round(v * 100) + '%' },
    { key: 'echoTime',  label: 'Echo time',min: 0.05, max: 1,     step: 0.01, fmt: (v) => Math.round(v * 1000) + ' ms' },
    { key: 'gain',      label: 'Volume',   min: 0,    max: 2,     step: 0.01, fmt: (v) => Math.round(v * 100) + '%' }
  ];

  /* Frequency sliders feel wrong on a straight scale — the whole
     musical range is crammed into the first tenth. These map the
     slider's 0–1 travel onto the control's range logarithmically. */
  function toSlider(ctl, v) {
    if (!ctl.log) return v;
    const lo = Math.max(ctl.min, 20), hi = ctl.max;
    if (v <= lo) return 0;
    return Math.log(v / lo) / Math.log(hi / lo);
  }
  function fromSlider(ctl, t) {
    if (!ctl.log) return t;
    const lo = Math.max(ctl.min, 20), hi = ctl.max;
    const v = lo * Math.pow(hi / lo, t);
    return t <= 0 ? ctl.min : v;
  }

  function SampleEditor({ version, onPlay, onBaked }) {
    const canvasRef = React.useRef(null);
    const [edit, setEditState] = React.useState(() => E.getSampleEdit('studio'));
    const [dragging, setDragging] = React.useState(null);   // drives the cursor / border only
    /* The drag logic reads this ref, not the state above: a pointermove
       can arrive before React has re-rendered after pointerdown, and
       state would still say "not dragging" — losing the first moves of
       a fast drag. The ref is right the instant it's set. */
    const dragRef = React.useRef(null);
    const [baking, setBaking] = React.useState(false);
    const [, force] = React.useState(0);

    const info = E.sampleInfo('studio') || { seconds: 0 };
    const duration = info.seconds || 0;
    const start = edit.start;
    const end = edit.end == null ? duration : edit.end;

    // A new recording (version bump) means fresh settings.
    React.useEffect(() => { setEditState(E.getSampleEdit('studio')); }, [version]);

    const apply = (changes) => setEditState(E.setSampleEdit('studio', changes));

    /* --- drawing --------------------------------------------------- */
    React.useEffect(() => {
      const canvas = canvasRef.current;
      if (!canvas) return undefined;
      const draw = () => {
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const W = Math.max(1, Math.round(rect.width * dpr));
        const H = Math.max(1, Math.round(rect.height * dpr));
        if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
        const g = canvas.getContext('2d');
        const peaks = E.sampleWaveform('studio', Math.floor(rect.width));
        g.clearRect(0, 0, W, H);
        if (!peaks) return;

        const css = getComputedStyle(document.documentElement);
        const bone = css.getPropertyValue('--bone-400').trim() || '#8A8475';
        const ember = css.getPropertyValue('--ember-500').trim() || '#F08A1D';
        const dim = css.getPropertyValue('--stage-600').trim() || '#232B3B';

        const x0 = (duration ? start / duration : 0) * W;
        const x1 = (duration ? end / duration : 1) * W;

        // The kept region, lit; the rest, dimmed.
        g.fillStyle = 'rgba(240,138,29,0.10)';
        g.fillRect(x0, 0, x1 - x0, H);

        const mid = H / 2;
        const n = peaks.length;
        for (let i = 0; i < n; i++) {
          const px = (i / n) * W;
          const inside = px >= x0 && px <= x1;
          const h = Math.max(1, peaks[i] * (H * 0.92));
          g.fillStyle = inside ? ember : dim;
          g.fillRect(px, mid - h / 2, Math.max(1, W / n - 0.5), h);
        }

        // Handles.
        g.fillStyle = bone;
        g.fillRect(x0 - 1 * dpr, 0, 2 * dpr, H);
        g.fillRect(x1 - 1 * dpr, 0, 2 * dpr, H);
      };
      draw();
      const ro = new ResizeObserver(draw);
      ro.observe(canvas);
      return () => ro.disconnect();
    }, [version, start, end, duration]);

    /* --- dragging the region ---------------------------------------- */
    const timeAt = (e) => {
      const rect = canvasRef.current.getBoundingClientRect();
      const t = ((e.clientX - rect.left) / rect.width) * duration;
      return Math.max(0, Math.min(duration, t));
    };

    const beginDrag = (which) => { dragRef.current = which; setDragging(which); };
    const onDown = (e) => {
      e.preventDefault();
      try { canvasRef.current.setPointerCapture(e.pointerId); } catch (err) {}
      const t = timeAt(e);
      const cur = E.getSampleEdit('studio');
      const curEnd = cur.end == null ? duration : cur.end;
      const px = duration ? canvasRef.current.getBoundingClientRect().width / duration : 1;
      const grab = 10 / px;                                  // 10px of slack
      if (Math.abs(t - cur.start) < grab) beginDrag('start');
      else if (Math.abs(t - curEnd) < grab) beginDrag('end');
      else { apply({ start: t, end: t + 0.02 }); beginDrag('end'); }
    };
    const onMove = (e) => {
      const which = dragRef.current;
      if (!which) return;
      const t = timeAt(e);
      // Always read the live values: state may be a render behind.
      const cur = E.getSampleEdit('studio');
      const curEnd = cur.end == null ? duration : cur.end;
      if (which === 'start') apply({ start: Math.min(t, curEnd - 0.02) });
      else apply({ end: Math.max(t, cur.start + 0.02) });
    };
    const onUp = () => { dragRef.current = null; setDragging(null); };

    /* --- bake ------------------------------------------------------- */
    const bake = () => {
      setBaking(true);
      E.bakeSample('studio').then((res) => {
        setBaking(false);
        setEditState(E.getSampleEdit('studio'));
        onBaked(res);
      }, () => setBaking(false));
    };

    const edited = E.sampleIsEdited('studio');
    const fmtTime = (t) => t.toFixed(2) + 's';

    return (
      <div className="jam-editor">
        <div className="jam-editor-head">
          <span className="jam-tempo-unit">
            Cut: {fmtTime(start)} – {fmtTime(end)} · {fmtTime(end - start)} of {fmtTime(duration)}
          </span>
          <span className="jam-editor-hint">drag the ends, or drag across to pick a new cut</span>
        </div>

        <canvas ref={canvasRef} className="jam-wave" data-dragging={!!dragging}
                onPointerDown={onDown} onPointerMove={onMove}
                onPointerUp={onUp} onPointerCancel={onUp}
                aria-label="Waveform of your recording. Drag to choose the part that plays." />

        <div className="jam-knobs">
          {EDIT_CONTROLS.map((ctl) => {
            const v = edit[ctl.key];
            const sliderVal = ctl.log ? toSlider(ctl, v) : v;
            return (
              <label key={ctl.key} className="jam-knob">
                <span className="jam-knob-name">{ctl.label}</span>
                <input type="range"
                       min={ctl.log ? 0 : ctl.min} max={ctl.log ? 1 : ctl.max}
                       step={ctl.log ? 0.001 : ctl.step}
                       value={sliderVal}
                       aria-label={ctl.label}
                       onChange={(e) => {
                         const raw = Number(e.target.value);
                         apply({ [ctl.key]: ctl.log ? fromSlider(ctl, raw) : raw });
                       }} />
                <span className="jam-knob-value">{ctl.fmt(v)}</span>
              </label>
            );
          })}

          <label className="jam-knob jam-knob-toggle">
            <span className="jam-knob-name">Reverse</span>
            <button type="button" className="jam-mini" data-on={edit.reverse}
                    aria-pressed={edit.reverse}
                    onClick={() => apply({ reverse: !edit.reverse })}>
              {edit.reverse ? 'On' : 'Off'}
            </button>
          </label>
        </div>

        <div className="jam-editor-actions">
          <Button size="sm" variant="ghost" onClick={onPlay}>Hear it</Button>
          <Button size="sm" variant="ghost" disabled={!edited}
                  onClick={() => setEditState(E.resetSampleEdit('studio'))}>
            Reset
          </Button>
          <Button size="sm" variant={edited ? 'primary' : 'outline'} disabled={!edited || baking}
                  onClick={bake} title="Bakes the cut and the effects into the sample">
            {baking ? 'Baking…' : 'Set as cue'}
          </Button>
          <span className="jam-editor-hint">
            {edited
              ? 'Everything is live in the loop already. "Set as cue" makes it permanent — and it’s what gets published.'
              : 'Wind a control, or drag on the waveform, and hear it in the loop straight away.'}
          </span>
        </div>
      </div>
    );
  }

  function SamplePad({ state, onRecord, onStop, onPlay, onClear, onBaked, pitched, onPitched }) {
    return (
      <div className="jam-sample">
        <div className="jam-sample-main">
          {state.recording ? (
            <Button size="sm" variant="flag" className="jam-rec-armed" onClick={onStop}>
              ■ Stop ({state.countdown}s)
            </Button>
          ) : (
            <Button size="sm" variant={state.seconds ? 'ghost' : 'outline'} onClick={onRecord}>
              {state.seconds ? 'Re-record sample' : '● Record a sample'}
            </Button>
          )}

          {state.seconds != null && !state.recording && (
            <React.Fragment>
              <Button size="sm" variant="ghost" onClick={onPlay}>Hear it</Button>
              <Button size="sm" variant="ghost" onClick={onClear}>Clear</Button>
              <span className="jam-tempo-unit">{state.seconds}s captured</span>
              <label className="jam-inline-label jam-check">
                <input type="checkbox" checked={pitched}
                       onChange={(e) => onPitched(e.target.checked)} />
                Play it from the keyboard
              </label>
            </React.Fragment>
          )}
        </div>

        {state.seconds != null && !state.recording && (
          <SampleEditor version={state.version} onPlay={onPlay} onBaked={onBaked} />
        )}

        <p className="jam-sample-note">
          {state.error
            ? MIC_MESSAGES[state.error] || 'The microphone could not be started.'
            : 'Record up to ' + E.MAX_SAMPLE_SECONDS + ' seconds — a word, a clap, a guitar stab — ' +
              'and lay it into the grid. It stays on your device unless you publish it to the ' +
              'board and tick the box to include it. It can never travel in a loop link or a .mid.'}
        </p>
      </div>
    );
  }

  /* =================================================================
     THE GRID — drum lanes, the sample lane, and a row per keyboard
     layer showing what's been recorded into it.
     ================================================================= */
  function StepGrid(props) {
    const { pattern, uiStep, onToggle, onAudition, onToggleSample, hasSample,
            layerSteps, selectedLayer, onSelectLayer } = props;
    const ALL_STEPS = stepList(stepsOf(pattern));

    const cell = (key, opts) => (
      <button key={key} type="button" className="jam-cell"
              data-beat={opts.step % E.STEPS_PER_BEAT === 0}
              data-bar={opts.step % BAR_STEPS === 0}
              data-playing={uiStep === opts.step}
              aria-pressed={!!opts.on}
              aria-label={opts.label}
              onClick={opts.onClick} />
    );

    return (
      <div className="jam-grid-scroll">
        <div className="jam-seq" data-steps={ALL_STEPS.length}
             style={{ '--steps': ALL_STEPS.length }}>
          <div className="jam-row jam-ruler" aria-hidden="true">
            <div />
            {ALL_STEPS.map((s) => (
              <div key={s} className="jam-tick"
                   data-beat={s % E.STEPS_PER_BEAT === 0}
                   data-bar={s % BAR_STEPS === 0}>
                {s % E.STEPS_PER_BEAT === 0 ? (s / E.STEPS_PER_BEAT) + 1 : '·'}
              </div>
            ))}
          </div>

          {E.LANES.map((lane, li) => (
            <div className="jam-row" key={lane.id}>
              <button type="button" className="jam-lane-label"
                      onClick={() => onAudition(lane.id)}
                      title={'Hear the ' + lane.label}>{lane.label}</button>
              {ALL_STEPS.map((s) => cell(s, {
                step: s,
                on: pattern.drums[li][s],
                label: lane.label + ', step ' + (s + 1),
                onClick: () => onToggle(li, s)
              }))}
            </div>
          ))}

          {hasSample && (
            <div className="jam-row">
              <div className="jam-lane-label jam-lane-sample">Sample</div>
              {ALL_STEPS.map((s) => cell('smp' + s, {
                step: s,
                on: pattern.sample[s],
                label: 'Sample, step ' + (s + 1),
                onClick: () => onToggleSample(s)
              }))}
            </div>
          )}

          {pattern.layers.map((layer, li) => (
            <div className="jam-row" key={'layer' + li}>
              <button type="button"
                      className="jam-lane-label jam-lane-layer"
                      data-selected={selectedLayer === li}
                      onClick={() => onSelectLayer(li)}
                      title={'Play and record into layer ' + (li + 1)}>
                L{li + 1} · {(E.VOICES.find((v) => v.id === layer.voice) || {}).label}
              </button>
              {ALL_STEPS.map((s) => (
                <div key={s} className="jam-cell"
                     data-beat={s % E.STEPS_PER_BEAT === 0}
                     data-bar={s % BAR_STEPS === 0}
                     data-playing={uiStep === s}
                     data-note={!!layerSteps[li][s]}
                     data-dim={layer.muted}
                     aria-hidden="true" />
              ))}
            </div>
          ))}
        </div>
      </div>
    );
  }

  /* =================================================================
     THE KEYBOARD
     ================================================================= */
  function Keyboard({ baseMidi, down, onPress, onRelease }) {
    const groups = buildKeyboard(baseMidi);

    /* Pointer capture means a finger that slides off a key still sends
       its release to that key, instead of leaving a note ringing. */
    const bind = (midi) => ({
      onPointerDown: (e) => {
        e.preventDefault();
        if (e.currentTarget.setPointerCapture) {
          try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
        }
        onPress(midi);
      },
      onPointerUp: () => onRelease(midi),
      onPointerCancel: () => onRelease(midi),
      onLostPointerCapture: () => onRelease(midi)
    });

    return (
      <div className="jam-keyboard">
        {groups.map((g, gi) => {
          // Black keys are placed as a share of *this group's* width, so
          // the maths holds whether the groups sit side by side or stack.
          const unit = 100 / g.whiteCount;
          const blackWidth = unit * 0.62;
          return (
            <div className="jam-keys" key={gi} style={{ flexGrow: g.whiteCount }}>
              {g.whites.map((k) => (
                <button key={k.semi} type="button" className="jam-key-white"
                        data-down={!!down[k.midi]}
                        aria-label={noteLabel(k.midi)}
                        {...bind(k.midi)}>
                  <span className="jam-key-hint">{HINT_FOR_SEMI[k.semi] || ''}</span>
                </button>
              ))}
              {g.blacks.map((k) => (
                <button key={k.semi} type="button" className="jam-key-black"
                        data-down={!!down[k.midi]}
                        aria-label={noteLabel(k.midi)}
                        style={{
                          left: 'calc(' + ((k.afterWhite + 1) * unit) + '% - ' + (blackWidth / 2) + '%)',
                          width: blackWidth + '%'
                        }}
                        {...bind(k.midi)}>
                  <span className="jam-key-hint">{HINT_FOR_SEMI[k.semi] || ''}</span>
                </button>
              ))}
            </div>
          );
        })}
      </div>
    );
  }

  /* =================================================================
     THE STUDIO — everything above the send form.
     ================================================================= */
  function Studio(props) {
    const layerSteps = props.pattern.layers.map((layer) => {
      const map = {};
      layer.notes.forEach((n) => { map[n.step] = true; });
      return map;
    });

    const selectedName = 'Layer ' + (props.selectedLayer + 1) +
      (props.sampleKeyboard ? ' · sample' : '');

    return (
      <section style={{ padding: '0 0 var(--sp-5)' }}>
        {/* Bottom padding is deliberately small: the section that follows
            brings its own full top padding, and the two used to stack into
            a gap you could park a van in. */}
        {/* A two-bar loop borrows the wide container: thirty-two steps plus
            a label column need more room than the standard column, and on
            a big screen that's the difference between seeing the whole loop
            and scrolling to reach the end. A one-bar loop fits the normal
            measure, so it stays in step with the rest of the page. */}
        <div className={'nm-container' + (props.steps === 32 ? ' jam-wide' : '')}>
          <SectionHeading kicker="Step One" title="The Audition" />
          <p style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--fs-body)',
                      color: 'var(--bone-300)', margin: '18px 0 40px', maxWidth: 680, lineHeight: 1.55 }}>
            One bar to start, sixteen steps — flip it to two if you need the room. Build a beat,
            then record a riff over it, let it loop, and play another one on top: up to four
            layers, each with its own voice. This is the part where creativity is formally
            assessed. There is no wrong answer. There is, however, a boring one.
          </p>

          {props.banner}

          <Card padding="clamp(20px,3vw,36px)">
            <Transport {...props} playing={props.playing || !!props.previewTitle}
                       layerName={selectedName} />

            <div style={{ marginTop: 'var(--sp-5)' }}>
              <LayerStrip layers={props.pattern.layers}
                          selected={props.selectedLayer}
                          onSelect={props.onSelectLayer}
                          onVoice={props.onLayerVoice}
                          onVolume={props.onLayerVolume}
                          onMute={props.onLayerMute}
                          onSolo={props.onLayerSolo}
                          onClear={props.onLayerClear} />
            </div>

            <div style={{ marginTop: 'var(--sp-5)' }}>
              <StepGrid pattern={props.pattern} uiStep={props.uiStep}
                        onToggle={props.onToggle} onAudition={props.onAudition}
                        onToggleSample={props.onToggleSample}
                        hasSample={props.sampleState.seconds != null}
                        layerSteps={layerSteps}
                        selectedLayer={props.selectedLayer}
                        onSelectLayer={props.onSelectLayer} />
            </div>

            <ArrangeBar {...props.arrange} />

            <Keyboard baseMidi={props.baseMidi} down={props.down}
                      onPress={props.onPress} onRelease={props.onRelease} />

            <div className="jam-octave">
              <Button size="sm" variant="ghost" onClick={() => props.onOctave(-1)}>◀ Octave</Button>
              <span style={{ minWidth: 42, textAlign: 'center' }}>{noteLabel(props.baseMidi)}</span>
              <Button size="sm" variant="ghost" onClick={() => props.onOctave(1)}>Octave ▶</Button>
              <span style={{ marginLeft: 'auto', textAlign: 'right' }}>
                Mouse, finger, or type it — your keyboard's bottom two rows are the
                lower octave, the top two are the upper. Space starts and stops.
              </span>
            </div>

            <SamplePad state={props.sampleState}
                       onRecord={props.onSampleRecord}
                       onStop={props.onSampleStop}
                       onPlay={props.onSamplePlay}
                       onClear={props.onSampleClear}
                       onBaked={props.onSampleBaked}
                       pitched={props.sampleKeyboard}
                       onPitched={props.onSampleKeyboard} />

            <div className="jam-actions" style={{ marginTop: 'var(--sp-5)' }}>
              <Button size="sm" variant="ghost" onClick={props.onClearDrums}>Clear Drums</Button>
              <Button size="sm" variant="ghost" onClick={props.onClearKeys}>Clear All Layers</Button>
              <Button size="sm" variant="ghost" onClick={props.onClearAll}>Start Over</Button>
              <span style={{ marginLeft: 'auto', fontFamily: 'var(--font-stamp)', fontSize: 11,
                             letterSpacing: '.12em', textTransform: 'uppercase',
                             color: 'var(--bone-400)', alignSelf: 'center' }}>
                {E.countNotes(props.pattern)} note{E.countNotes(props.pattern) === 1 ? '' : 's'} across {E.MAX_LAYERS} layers
              </span>
            </div>
          </Card>
        </div>
      </section>
    );
  }

  /* =================================================================
     SEND IT TO THE BAND
     ================================================================= */
  const INSTRUMENTS = [
    { value: 'keys', label: 'Keys' },
    { value: 'guitar', label: 'Guitar' },
    { value: 'bass', label: 'Bass' },
    { value: 'drums', label: 'Drums' },
    { value: 'vocals', label: 'Vocals' },
    { value: 'other', label: 'Other — will explain in the cover letter' },
    { value: 'jamming', label: 'Not applying, just jamming' }
  ];

  function SendPanel({ pattern, loopCode, loopLink, onDownload }) {
    const [name, setName] = React.useState('');
    const [email, setEmail] = React.useState('');
    const [instrument, setInstrument] = React.useState('keys');
    const [message, setMessage] = React.useState('');
    const [status, setStatus] = React.useState(null);
    const [sending, setSending] = React.useState(false);
    const [sent, setSent] = React.useState(false);
    const [copied, setCopied] = React.useState(false);
    const botRef = React.useRef(null);

    const empty = E.isEmptyPattern(pattern);

    function copyLink() {
      const done = () => {
        setCopied(true);
        window.setTimeout(() => setCopied(false), 2500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(loopLink).then(done, fallbackCopy);
      } else {
        fallbackCopy();
      }
      function fallbackCopy() {
        // Older browsers, and any page not served over https.
        const ta = document.createElement('textarea');
        ta.value = loopLink;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); done(); } catch (e) {
          setStatus({ tone: 'warn', text: 'Copying is blocked here — select the code below and copy it by hand.' });
        }
        document.body.removeChild(ta);
      }
    }

    function submit(e) {
      e.preventDefault();
      setStatus(null);

      if (botRef.current && botRef.current.checked) return;   // a bot filled the honeypot

      if (empty) {
        setStatus({
          tone: 'warn',
          text: "Your application is blank. We admire the confidence, but program a beat or play a few notes first — the audition is the whole interview here."
        });
        return;
      }
      if (!FORM_READY) {
        setStatus({
          tone: 'warn',
          text: "Applications aren't open yet — this page hasn't been pointed at a working form, so nothing would actually reach the band. Your loop is safe though: download the .mid or copy the link below and send it over however you like."
        });
        return;
      }

      // A one-line summary of what's on each layer, so the email says
      // something useful without anyone having to open the link first.
      const layerSummary = pattern.layers
        .map((layer, i) => {
          if (!layer.notes.length) return null;
          const voice = (E.VOICES.find((v) => v.id === layer.voice) || {}).label || layer.voice;
          return 'Layer ' + (i + 1) + ': ' + voice + ' (' + layer.notes.length + ' notes)';
        })
        .filter(Boolean)
        .join(', ') || 'drums only';

      setSending(true);
      fetch(CONFIG.formEndpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({
          // Formspree's own fields all start with an underscore.
          _subject: CONFIG.subject || 'Big Daddy jam submission',
          _replyto: email,

          /* The marker the TES back-end looks for so these don't get
             filed as CRM leads. Keep it in step with the classifier in
             TES_Back-End. */
          form_source: CONFIG.sourceTag || 'BIG-DADDY-JAM',

          // These names are what you'll see as the labels in the email,
          // so they're written the way you'd want to read them.
          name: name,
          email: email,
          position_applying_for: (INSTRUMENTS.find((i) => i.value === instrument) || {}).label || instrument,
          cover_letter: message || '(none supplied)',
          tempo: pattern.bpm + ' BPM',
          layers: layerSummary,
          listen_to_the_loop: loopLink,
          loop_code: loopCode
        })
      })
        /* Formspree answers 200 on success and 4xx with an `errors`
           array on failure, so the status code is what to trust. */
        .then((res) => res.json().then(
          (data) => ({ ok: res.ok, data: data }),
          () => ({ ok: res.ok, data: null })
        ))
        .then((result) => {
          setSending(false);
          if (result.ok) {
            setSent(true);
            setStatus({ tone: 'ok', text: "Submitted. It's in the band's inbox — thanks for playing." });
          } else {
            const errs = result.data && result.data.errors;
            const detail = errs && errs.length
              ? errs.map((e) => e.message).join(', ')
              : (result.data && result.data.error) || '';
            setStatus({
              tone: 'error',
              text: 'The mail service turned that away' + (detail ? ' — ' + detail : '') +
                    '. Not your fault, and your loop is safe: grab the .mid or copy the link below.'
            });
          }
        })
        .catch((err) => {
          setSending(false);
          setStatus({
            tone: 'error',
            text: "Couldn't reach the mail service (" + (err && err.message ? err.message : 'network error') +
                  '). Your loop is safe — download the .mid or copy the link below and send it over another way.'
          });
        });
    }

    return (
      <section id="send" style={{ padding: 'var(--section-y) 0' }}>
        <div className="nm-container jam-stack"
             style={{ display: 'grid', gridTemplateColumns: '1fr 1fr',
                      gap: 'clamp(32px,5vw,80px)', alignItems: 'start' }}>
          <div>
            <SectionHeading kicker="Step Two" title={<span>Submit For<br/>Review</span>} />
            <p style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--fs-lead)',
                        color: 'var(--bone-300)', marginTop: 22, maxWidth: 460, lineHeight: 1.5 }}>
              Your application travels as a link. We click it, your exact loop opens and plays on
              this same page, and we can pull the MIDI straight into a session. Every one gets
              listened to by an actual human being in an actual backwards cap.
            </p>
            <p style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--fs-sm)',
                        color: 'var(--bone-400)', marginTop: 14, maxWidth: 460, lineHeight: 1.55 }}>
              Candidates are considered for one-off jams and paying gigs alike, so say which
              you're after. We are not currently able to relocate anyone, but we have been known
              to swing by and pick people up.
            </p>

            <div className="jam-actions" style={{ marginTop: 28 }}>
              <Button variant="outline" size="md" onClick={onDownload} disabled={empty}>
                Download .mid
              </Button>
              <Button variant="ghost" size="md" onClick={copyLink} disabled={empty}>
                {copied ? 'Link copied!' : 'Copy loop link'}
              </Button>
            </div>

            {!empty && (
              <div style={{ marginTop: 20 }}>
                <div style={{ fontFamily: 'var(--font-stamp)', fontSize: 10, letterSpacing: '.14em',
                              textTransform: 'uppercase', color: 'var(--bone-400)', marginBottom: 8 }}>
                  Your submission code
                </div>
                <div className="jam-code-box">{loopCode}</div>
              </div>
            )}
          </div>

          <Card padding="clamp(24px,3vw,40px)">
            {sent ? (
              <div style={{ textAlign: 'center', padding: '32px 0' }}>
                <div style={{ fontFamily: 'var(--font-display)', fontSize: 44, color: 'var(--ember-glow)',
                              textTransform: 'uppercase', lineHeight: 0.9 }}>Application<br/>Received!</div>
                <p style={{ color: 'var(--bone-300)', marginTop: 16 }}>
                  It's in the pile, and somebody will listen to the whole thing — which is more
                  than most companies can say. If it moves us, you'll hear back. Keep it loud.

                {/* Honeypot — invisible to people, irresistible to bots. */}

  /* =================================================================
     THE JAM BOARD

     Everything from here to JamFooter is the community half of the page:
     publishing a loop, browsing what everyone else made, and picking one
     up to build on.

     The rule that shapes all of it: a published jam is never edited.
     "Jam on this" loads somebody's loop into the studio and remembers
     whose it was; publishing then creates a NEW jam pointing back at
     theirs. There is no path that changes what someone else posted, and
     the server refuses one even if the page asks.
     ================================================================= */

  /* The API only exists on the deployed site. Opened from a file:// URL
     — or on the old host during the migration — the studio still works
     completely and the board says where to find it, rather than showing
     a broken grid. */
  const PUBLISH_READY = location.protocol === 'http:' || location.protocol === 'https:';

  const MINE_KEY = 'bd.jam.mine';        // { <jam id>: <withdrawal token> }

  function readMine() {
    try { return JSON.parse(localStorage.getItem(MINE_KEY)) || {}; }
    catch (e) { return {}; }             // private mode, cleared storage, whatever
  }

  function rememberMine(id, token) {
    try {
      const all = readMine();
      all[id] = token;
      localStorage.setItem(MINE_KEY, JSON.stringify(all));
    } catch (e) { /* the success panel still shows the token */ }
  }

  function forgetMine(id) {
    try {
      const all = readMine();
      delete all[id];
      localStorage.setItem(MINE_KEY, JSON.stringify(all));
    } catch (e) {}
  }

  /* ---- talking to the API ---------------------------------------- */

  async function apiCall(path, options) {
    const res = await fetch(path, Object.assign({ credentials: 'same-origin' }, options));
    let data = null;
    try { data = await res.json(); } catch (e) { /* 500s can arrive empty */ }
    if (!res.ok) {
      const err = new Error((data && data.message) || 'That did not work.');
      err.code = (data && data.error) || 'http_' + res.status;
      err.status = res.status;
      throw err;
    }
    return data;
  }

  const API = {
    mayPost: () => apiCall('/api/session'),
    signIn: (passphrase) => apiCall('/api/session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ passphrase })
    }),
    list: (query) => apiCall('/api/jams?' + new URLSearchParams(query).toString()),
    get: (id) => apiCall('/api/jams/' + encodeURIComponent(id)),
    retract: (id, token) => apiCall('/api/jams/' + encodeURIComponent(id) + '/retract', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token })
    }),
    publish: (meta, blob) => {
      /* multipart rather than a two-step upload: the sample is ~176 KB,
         which is nothing against the request limit, and one request means
         there is no half-published state to clean up. */
      const form = new FormData();
      form.set('meta', JSON.stringify(meta));
      if (blob) form.set('sample', blob, 'sample.wav');
      return apiCall('/api/jams', { method: 'POST', body: form });
    }
  };

  /* ---- small helpers ---------------------------------------------- */

  function timeAgo(ms) {
    const secs = Math.max(1, Math.round((Date.now() - ms) / 1000));
    if (secs < 60) return 'just now';
    const mins = Math.round(secs / 60);
    if (mins < 60) return mins + (mins === 1 ? ' minute ago' : ' minutes ago');
    const hours = Math.round(mins / 60);
    if (hours < 24) return hours + (hours === 1 ? ' hour ago' : ' hours ago');
    const days = Math.round(hours / 24);
    if (days < 30) return days + (days === 1 ? ' day ago' : ' days ago');
    return new Date(ms).toLocaleDateString();
  }

  const VOICE_LABEL = {};
  E.VOICES.forEach((v) => { VOICE_LABEL[v.id] = v.label; });

  function byline(author) { return author || 'Anonymous'; }

  /* ---- the pattern thumbnail --------------------------------------
     One <svg> with one <rect> per hit, not a grid of divs: a 32x7 dot
     grid as elements would be 224 nodes per card, and two dozen cards
     would put five thousand nodes on the page for decoration.
     ----------------------------------------------------------------- */
  function LoopThumb({ pattern, step }) {
    if (!pattern) return null;
    const STEPS = stepsOf(pattern);       // thumbnails follow each loop's own length
    const marks = [];

    for (let lane = 0; lane < E.LANES.length; lane++) {
      const row = pattern.drums[lane] || [];
      for (let s = 0; s < STEPS; s++) {
        if (row[s]) marks.push(<rect key={'d' + lane + '-' + s} x={s} y={lane} width="0.8" height="0.8" rx="0.2" fill="var(--bone-300)" />);
      }
    }

    // All four layers collapse onto one row — this is a glance, not a score.
    const noteRow = new Array(STEPS).fill(false);
    pattern.layers.forEach((layer) => {
      layer.notes.forEach((n) => { if (n.step < STEPS) noteRow[n.step] = true; });
    });
    noteRow.forEach((on, s) => {
      if (on) marks.push(<rect key={'n' + s} x={s} y={E.LANES.length} width="0.8" height="0.8" rx="0.2" fill="var(--ember-500)" />);
    });

    return (
      <svg className="jam-thumb" viewBox={'0 0 ' + STEPS + ' ' + (E.LANES.length + 1)}
           preserveAspectRatio="none" aria-hidden="true">
        {stepList(STEPS / 8).map((i) => i * 8).map((s) => (
          <rect key={'g' + s} x={s} y="0" width="0.06" height={E.LANES.length + 1} fill="var(--stage-600)" />
        ))}
        {marks}
        {step >= 0 && (
          <rect className="jam-thumb-head" x={step} y="0" width="0.9"
                height={E.LANES.length + 1} fill="var(--ember-glow)" opacity="0.28" />
        )}
      </svg>
    );
  }

  /* ---- one jam on the wall ---------------------------------------- */

  function JamCard({ jam, pattern, playing, step, busy, mine, onPlay, onStop, onRemix, onWithdraw, onOpenLineage }) {
    const voices = (jam.voices || []).map((v) => VOICE_LABEL[v] || v).join(' · ');

    return (
      <article className={'jam-card' + (playing ? ' is-playing' : '')}>
        <header className="jam-card-head">
          <h3 className="jam-card-title">{jam.title}</h3>
          <p className="jam-card-by">
            {byline(jam.author)} · {timeAgo(jam.created_at)}
          </p>
        </header>

        <LoopThumb pattern={pattern} step={playing ? step : -1} />

        <ul className="jam-card-facts">
          <li>{jam.bpm} BPM</li>
          {jam.note_count > 0 && <li>{jam.note_count} {jam.note_count === 1 ? 'note' : 'notes'}</li>}
          {voices && <li>{voices}</li>}
          {jam.sample && <li className="jam-card-hassample">has a sample</li>}
        </ul>

        {jam.note && <p className="jam-card-note">{jam.note}</p>}

        {jam.parent_id && (
          <p className="jam-card-lineage">
            Built on{' '}
            <a href={'?jam=' + jam.parent_id} onClick={(ev) => { ev.preventDefault(); onOpenLineage(jam.parent_id); }}>
              another jam
            </a>
          </p>
        )}
        {jam.remix_count > 0 && (
          <p className="jam-card-lineage">
            {jam.remix_count} {jam.remix_count === 1 ? 'version grew' : 'versions grew'} from this
          </p>
        )}

        <div className="jam-card-actions">
          <Button size="sm" variant={playing ? 'flag' : 'outline'}
                  onClick={playing ? onStop : onPlay} disabled={busy}>
            {busy ? 'Loading…' : playing ? '■ Stop' : '▶ Play'}
          </Button>
          <Button size="sm" variant="primary" onClick={onRemix}>Jam on this</Button>
          {mine && (
            <Button size="sm" variant="ghost" onClick={onWithdraw}>Withdraw</Button>
          )}
        </div>
      </article>
    );
  }

  /* ---- the board -------------------------------------------------- */

  const SORTS = [
    ['recent', 'Newest'],
    ['remixed', 'Most built on']
  ];

  const BPM_BANDS = [
    ['', 'Any tempo'],
    ['60-90', 'Slow (60–90)'],
    ['90-120', 'Mid (90–120)'],
    ['120-150', 'Quick (120–150)'],
    ['150-180', 'Fast (150–180)']

  function JamBoard({ state, filters, onFilters, onPlay, onStop, onRemix, onWithdraw, onMore, onOpenLineage, playingId, playStep, loadingId, mine }) {
    if (!PUBLISH_READY) {
      return (
        <section className="jam-section" id="board">
          <SectionHeading kicker="Step Three" title="What Everybody Else Made" />
          <Card>
            <p className="jam-empty">
              The board lives on the real site — open{' '}
              <a href="https://bigdaddyand.co/jam">bigdaddyand.co/jam</a>{' '}
              to hear what everyone has been posting. Everything else on this page

            </p>
          </Card>
        </section>
      );
    }

    return (
      <section className="jam-section" id="board">
        <SectionHeading
          kicker="Step Three"
          title="What Everybody Else Made"
          blurb="Play them, then pick one up and make it yours. Nothing here can be edited — building on somebody's loop posts a new one that remembers theirs."
        />

        <div className="jam-board-controls">
          <div className="jam-chips" role="group" aria-label="Sort">
            {SORTS.map(([value, label]) => (
              <button key={value} type="button"
                      className={'jam-chip' + (filters.sort === value ? ' is-on' : '')}
                      aria-pressed={filters.sort === value}

            ))}
          </div>

          <label className="jam-inline-label">
            <span className="jam-sr">Tempo</span>
            <select className="jam-select" value={filters.band}
                    onChange={(ev) => onFilters({ band: ev.target.value })}>
              {BPM_BANDS.map(([value, label]) => <option key={label} value={value}>{label}</option>)}
            </select>
          </label>

          <label className="jam-inline-label">
            <span className="jam-sr">Instrument</span>
            <select className="jam-select" value={filters.voice}
                    onChange={(ev) => onFilters({ voice: ev.target.value })}>
              <option value="">Any instrument</option>
              {E.VOICES.map((v) => <option key={v.id} value={v.id}>{v.label}</option>)}
            </select>
          </label>

          <label className="jam-inline-label jam-check">
            <input type="checkbox" checked={filters.hasSample}
                   onChange={(ev) => onFilters({ hasSample: ev.target.checked })} />

          </label>
        </div>

        {state.error && (
          <Card><p className="jam-empty">{state.error}</p></Card>
        )}

        {!state.error && state.loading && !state.jams.length && (
          <p className="jam-empty">Fetching the wall…</p>
        )}

        {!state.error && !state.loading && !state.jams.length && (
          <Card>
            <p className="jam-empty">
              Nothing on the wall yet that matches. Build something upstairs and
              be the first name on it.
            </p>
          </Card>
        )}

        {!!state.jams.length && (
          <div className="jam-grid">
            {state.jams.map((jam) => (
              <JamCard
                key={jam.id}
                jam={jam}
                pattern={state.patterns[jam.id]}
                playing={playingId === jam.id}
                step={playStep}
                busy={loadingId === jam.id}
                mine={!!mine[jam.id]}
                onPlay={() => onPlay(jam)}
                onStop={onStop}
                onRemix={() => onRemix(jam)}
                onWithdraw={() => onWithdraw(jam)}
                onOpenLineage={onOpenLineage}
              />
            ))}
          </div>
        )}

        {state.hasMore && (
          <div className="jam-more">
            <Button variant="outline" onClick={onMore} disabled={state.loading}>
              {state.loading ? 'Loading…' : 'Show me more'}

          </div>

  }

  /* ---- riffing on somebody ---------------------------------------- */

  /* Dismissing only hides the notice — the visitor is still riffing on
     the parent, and publishing still links back to it. "Start fresh
     instead" is the one that actually lets go. */
  function RemixBanner({ parent, onClear, onHearOriginal, onDismiss }) {
    if (!parent) return null;
    return (
      <div className="jam-remix-banner" role="status">
        <span>
          Riffing on <strong>{parent.title}</strong> by {byline(parent.author)}.
          Publishing makes a new jam — theirs stays exactly as they left it.
        </span>
        <span className="jam-remix-actions">
          <button type="button" className="jam-linkbtn" onClick={onHearOriginal}>Hear the original</button>
          <button type="button" className="jam-linkbtn" onClick={onClear}>Start fresh instead</button>
          <button type="button" className="jam-remix-close" onClick={onDismiss}
                  aria-label="Hide this notice" title="Hide this notice">×</button>
        </span>
      </div>
    );
  }

  /* ---- putting one up --------------------------------------------- */

  function PublishPanel({ pattern, parent, sampleState, mayPost, onPublished, onNeedSignIn, onSampleBaked }) {
    const [title, setTitle] = React.useState('');
    const [author, setAuthor] = React.useState('');
    const [anon, setAnon] = React.useState(false);
    const [note, setNote] = React.useState('');
    const [includeSample, setIncludeSample] = React.useState(true);
    const [passphrase, setPassphrase] = React.useState('');
    const [busy, setBusy] = React.useState(false);
    const [error, setError] = React.useState(null);
    const [done, setDone] = React.useState(null);

    const hasSample = sampleState.seconds != null;
    const sampleBytes = hasSample ? (E.sampleInfo('studio') || {}).bytes || 0 : 0;

    if (!PUBLISH_READY) return null;

    async function submit(ev) {
      ev.preventDefault();
      setError(null);

      if (E.isEmptyPattern(pattern)) {
        setError('There is nothing in the loop yet. Put a beat down first.');
        return;
      }
      if (!title.trim()) {
        setError('Give it a name so people know what they are clicking.');
        return;
      }

      setBusy(true);
      try {
        if (!mayPost) {
          if (!passphrase.trim()) {
            setError('You need the band word to put something on the wall.');
            setBusy(false);
            return;
          }
          await API.signIn(passphrase.trim());
          onNeedSignIn(true);
        }

        /* If the editor has unsaved settings, bake them first: the upload
           must be the sound the visitor actually heard, not the raw take
           underneath it. */
        let blob = null;
        let sampleSeconds = null;
        if (hasSample && includeSample) {
          if (E.sampleIsEdited('studio')) {
            const baked = await E.bakeSample('studio');
            if (onSampleBaked) onSampleBaked(baked);
          }
          blob = E.sampleBlob('studio');
          sampleSeconds = (E.sampleInfo('studio') || {}).seconds || sampleState.seconds;
        }
        const result = await API.publish({
          title: title.trim(),
          author: anon ? null : (author.trim() || null),
          note: note.trim() || null,
          loop: E.encodeLoop(pattern),
          parent_id: parent ? parent.id : null,
          sample_seconds: sampleSeconds,
          /* A remix that isn't adding its own recording keeps the one it
             inherited, so the loop still sounds the way it did. */
          inherit_sample: !!(parent && parent.hasSample && !(hasSample && includeSample))
        }, blob);

        rememberMine(result.id, result.delete_token);
        setDone(result);
        setTitle(''); setNote('');
        onPublished(result);
      } catch (err) {
        if (err.code === 'bad_passphrase') {
          setError("That's not the word. Ask whoever sent you the link.");
        } else if (err.code === 'duplicate') {
          setError('That exact loop is already up there.');
        } else {
          setError(err.message || 'That did not send. Your loop is safe — try again.');
        }
      } finally {
        setBusy(false);
      }
    }

    if (done) {
      return (
        <section className="jam-section" id="publish">
          <SectionHeading kicker="Step Two" title="It's On The Wall" />
          <Card>
            <p className="jam-lede">Posted. Here's the link to it:</p>
            <p className="jam-code">{done.url}</p>
            <p className="jam-fineprint">
              Keep this if you might want to take it down again — it's the only
              way, and we can't get it back for you:
            </p>
            <p className="jam-code">{done.delete_token}</p>
            <p className="jam-fineprint">
              (This browser remembers it too, so a Withdraw button will show up
              on your own jam.)
            </p>
            <Button variant="outline" onClick={() => setDone(null)}>Post another</Button>
          </Card>
        </section>
      );
    }

    return (
      <section className="jam-section" id="publish">
        <SectionHeading
          kicker="Step Two"
          title="Put It On The Board"
          blurb="Once it's up it stays as you left it — that's the point. Anyone can build on it, and what they post is theirs, not a change to yours."
        />

        <Card>
          <form onSubmit={submit} className="jam-publish">
            <Field label="Call it something" required maxLength={80}
                   placeholder="Porch Stomp"
                   value={title} onChange={(ev) => setTitle(ev.target.value)} />

            <Field label="Your name" maxLength={40}
                   placeholder="Who made it" disabled={anon}
                   value={author} onChange={(ev) => setAuthor(ev.target.value)} />

            <label className="jam-inline-label jam-check">
              <input type="checkbox" checked={anon} onChange={(ev) => setAnon(ev.target.checked)} />
              Post it anonymously
            </label>

            <Field label="Anything to say about it" type="textarea" rows={2} maxLength={500}
                   hint="Optional."
                   placeholder="Needs a bass line. Someone please add a bass line."
                   value={note} onChange={(ev) => setNote(ev.target.value)} />

            {hasSample && (
              /* This reverses what the sample pad used to promise, so it is
                 stated in full, right where the decision is made, rather
                 than assumed from a ticked box. */
              <label className="jam-inline-label jam-check jam-consent">
                <input type="checkbox" checked={includeSample}
                       onChange={(ev) => setIncludeSample(ev.target.checked)} />
                <span>
                  Include my {sampleState.seconds}s recording
                  {sampleBytes ? ' (' + Math.round(sampleBytes / 1024) + ' KB)' : ''}.
                  <strong> It gets uploaded, and anyone with the link can play it
                  and build on it.</strong> Leave this unticked and only the notes
                  and drums go up.
                </span>
              </label>
            )}

            {!mayPost && (
              <Field label="The band word" required type="password"
                     autoComplete="current-password"
                     hint="Typed once — this browser remembers it after that."
                     placeholder="Ask whoever sent you the link"
                     value={passphrase} onChange={(ev) => setPassphrase(ev.target.value)} />
            )}

            {error && <p className="jam-error" role="alert">{error}</p>}

            <div className="jam-publish-actions">
              <Button type="submit" variant="primary" disabled={busy}>
                {busy ? 'Putting it up…' : parent ? 'Publish my version' : 'Publish it'}
              </Button>
              {parent && (
                <span className="jam-fineprint">
                  This will be posted as a new jam built on <strong>{parent.title}</strong>.
                </span>
              )}
            </div>
          </form>
        </Card>
      </section>
    );
  }
